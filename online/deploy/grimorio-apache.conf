# Grimorio: Apache inoltra tutto al server di gioco, compreso il WebSocket /ws.
# Funziona con qualsiasi Apache 2.4. Certbot crea da questo file la versione HTTPS.
<VirtualHost *:80>
    ServerName DOMINIO

    ProxyPreserveHost On
    ProxyRequests Off
    # nessuna richiesta legittima supera pochi KB
    LimitRequestBody 65536

    # tempo reale: le connessioni WebSocket vanno al server di gioco
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws$ ws://127.0.0.1:3077/ws [P,L]

    ProxyPass        / http://127.0.0.1:3077/ timeout=120
    ProxyPassReverse / http://127.0.0.1:3077/

    # compressione: il dizionario passa da 8 MB a meno di 2 MB
    AddOutputFilterByType DEFLATE text/html text/plain text/javascript application/json application/manifest+json image/svg+xml

    ErrorLog ${APACHE_LOG_DIR}/grimorio-error.log
    CustomLog ${APACHE_LOG_DIR}/grimorio-access.log combined
</VirtualHost>
