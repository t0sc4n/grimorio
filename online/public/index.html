<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13111d">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Grimorio: duelli di parole tra due maghi, anche a distanza.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Grimorio</title>
<link rel="stylesheet" href="/fonts.css">
<style>
/* Layout: una colonna da telefono. Campo di gioco al centro, avversario sopra, tu e il Grimorio sotto. Un solo aspetto notturno. */
:root {
  color-scheme: dark;
  --bg: #13111d; --panel: #1c1928; --panel2: #262236; --line: #37314f;
  --text: #efeaf7; --muted: #a59ebf;
  --blu: #5b93ff; --rosso: #ff626a; --oro: #f0c05a;
  --tile: #efe3c6; --tile-ink: #2a2116; --tile-pend: #fff3cf;
  --fuoco: #ff8a3d; --gelo: #8fe3ff; --acqua: #4aa6ff; --terra: #86c96b;
  --zA: #19203a; --zB: #2b1923; --zM: #1c1a28; --zS: #2c2414;
  --font-display: "Cinzel Decorative", "Cinzel", Georgia, serif;
  --font-body: "Alegreya Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: auto; }
body {
  background: var(--bg); color: var(--text); font: 16px/1.4 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
}
.wrap { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { font: 700 clamp(30px, 9vw, 44px)/1 var(--font-display); margin: 8px 0 0; letter-spacing: .02em; color: var(--oro); text-wrap: balance; }
h2 { font: 800 13px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0; }
p { margin: 0; }
.sub { color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
input[type=text], select {
  min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text);
  padding: 0 12px; font: 500 16px var(--font-body);
}
.check { display: flex; gap: 8px; align-items: center; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--oro); }
.check:has(input:disabled) { opacity: .45; }
.btn {
  min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2);
  color: var(--text); font: 700 15px var(--font-body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; justify-content: center;
}
.btn:focus-visible, .cell:focus-visible, .htile:focus-visible, .gameitem:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
.btn.primary { background: var(--oro); color: #2a1d02; border-color: transparent; }
.btn.danger { color: var(--rosso); }
.btn.on { border-color: var(--fuoco); color: var(--fuoco); background: #2e2018; }
.btn.on.cons { border-color: var(--terra); color: var(--terra); background: #1d2a1b; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.small { min-height: 34px; padding: 0 10px; font-size: 14px; }
.btn.link { background: none; border: none; color: var(--muted); text-decoration: underline; min-height: 32px; padding: 0 4px; }

/* lobby */
.gamelist { display: flex; flex-direction: column; gap: 8px; }
.gameitem { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--text); font: inherit; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.gameitem .vs { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.gameitem .st { font-size: 14px; color: var(--muted); }
.gameitem .tag { grid-row: span 2; align-self: center; font-size: 13px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--zS); color: var(--oro); }
.gameitem .tag.idle { background: transparent; color: var(--muted); }
.dotA { color: var(--blu); } .dotB { color: var(--rosso); }
.fonte { font-size: 12px; margin-top: 4px; } .fonte a { color: var(--muted); }
.note { font-size: 14px; color: var(--muted); }

/* partita */
.topbar { display: flex; align-items: center; gap: 8px; }
.topbar .title { font: 700 20px var(--font-display); color: var(--oro); flex: 1; }
.pbar { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.pbar .nm { font-weight: 800; min-width: 0; overflow-wrap: anywhere; }
.pbar.A .nm { color: var(--blu); } .pbar.B .nm { color: var(--rosso); }
.pbar.turn { border-color: var(--oro); box-shadow: 0 0 0 1px var(--oro) inset; }
.hp { height: 10px; border-radius: 6px; background: var(--panel2); overflow: hidden; }
.hp > i { display: block; height: 100%; border-radius: 6px; transition: width .4s; }
.pbar.A .hp > i { background: var(--blu); } .pbar.B .hp > i { background: var(--rosso); }
.hpn { font-variant-numeric: tabular-nums; font-weight: 800; }
.chips { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.ok { color: var(--oro); border-color: var(--oro); }
.status { text-align: center; font-weight: 800; font-size: 17px; }
.status small { display: block; font-weight: 500; font-size: 14px; color: var(--muted); }

.boardwrap { position: relative; }
.board { display: grid; grid-template-columns: repeat(11, 1fr); gap: 2px; padding: 4px; background: var(--line); border-radius: 10px; touch-action: manipulation; }
.cell { aspect-ratio: 1; position: relative; border-radius: 4px; background: var(--zM); display: grid; place-items: center; cursor: pointer; padding: 0; border: none; color: inherit; font: inherit; min-width: 0; }
.cell.zA { background: var(--zA); } .cell.zB { background: var(--zB); }
.cell.scudo { background-image: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--terra) 22%, transparent) 6px 8px); }
.cell.st { background: var(--zS); }
.cell.st::before { content: ""; position: absolute; left: -2px; right: -2px; top: 50%; height: 1px; background: var(--oro); opacity: .45; }
.mult { font-size: 9px; font-weight: 800; letter-spacing: .02em; color: var(--gelo); opacity: .8; }
.mult.PD { color: var(--oro); }
.tile { position: absolute; inset: 1px; border-radius: 4px; background: var(--tile); color: var(--tile-ink); display: grid; place-items: center; font-weight: 800; font-size: clamp(13px, 4.3vw, 21px); line-height: 1; box-shadow: inset 0 -3px 0 rgba(0,0,0,.22); }
.tile .v { position: absolute; right: 2px; bottom: 1px; font-size: 8px; font-weight: 700; opacity: .75; }
.tile.oA { box-shadow: inset 0 -3px 0 var(--blu); } .tile.oB { box-shadow: inset 0 -3px 0 var(--rosso); }
.tile.fuoco { outline: 2px solid var(--fuoco); outline-offset: -2px; }
.tile.gelo { outline: 2px solid var(--gelo); outline-offset: -2px; }
.tile.acqua { outline: 2px solid var(--acqua); outline-offset: -2px; }
.tile.difesa { outline: 2px solid var(--terra); outline-offset: -2px; }
.tile.consacrata { outline: 2px dashed var(--terra); outline-offset: -2px; }
.tile.pend { background: var(--tile-pend); outline: 2px solid var(--oro); outline-offset: -2px; }
.badge { position: absolute; top: -8px; right: -8px; z-index: 2; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--bg); font-size: 9px; font-weight: 800; line-height: 12px; text-align: center; border: 1px solid currentColor; font-variant-numeric: tabular-nums; }
.badge.difesa, .badge.consacrata { color: var(--terra); } .badge.fuoco { color: var(--fuoco); } .badge.gelo { color: var(--gelo); } .badge.acqua { color: var(--acqua); }
.arr { position: absolute; z-index: 2; width: 14px; height: 14px; border-radius: 7px; background: var(--bg); font-size: 11px; font-weight: 800; line-height: 14px; text-align: center; pointer-events: none; }
.arr.A { color: var(--blu); } .arr.B { color: var(--rosso); } .arr.pend { color: var(--oro); }
.arr.dx { left: -7px; top: calc(50% - 7px); }
.arr.giu { top: -7px; left: -7px; }
.arr.su { bottom: -7px; left: -7px; }
.board.placing { touch-action: none; }
.board.placing .tile.pend { cursor: grab; }
.board.dragging .tile.pend { cursor: grabbing; transform: scale(1.08); box-shadow: 0 6px 14px rgba(0,0,0,.55); z-index: 4; }
.cell.badcell { box-shadow: 0 0 0 2px var(--rosso) inset; }
.cell.launch { outline: 2px solid var(--fuoco); outline-offset: -1px; animation: pulse 1s ease-in-out infinite alternate; z-index: 1; }
.cell .dmg { position: absolute; top: -9px; right: -6px; z-index: 3; background: var(--fuoco); color: #221004; font-size: 11px; font-weight: 800; border-radius: 8px; padding: 0 5px; }
.cell .dmg.zero { background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
.cell.trail { box-shadow: 0 0 0 2px var(--fuoco) inset, 0 0 12px var(--fuoco); z-index: 1; }
.cell.trail .pw { position: absolute; top: -8px; left: -6px; z-index: 3; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--fuoco); color: #221004; font-size: 11px; font-weight: 800; line-height: 18px; text-align: center; }
.cell.hitdef { box-shadow: 0 0 0 2px var(--terra) inset, 0 0 12px var(--terra); }
.cell.origin { box-shadow: 0 0 0 2px var(--oro) inset; }
@keyframes pulse { from { box-shadow: 0 0 0 0 var(--fuoco); } to { box-shadow: 0 0 10px 1px var(--fuoco); } }
.legend { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: var(--c); }

.preview { min-height: 24px; text-align: center; font-weight: 700; }
.preview.err { color: var(--rosso); font-weight: 500; }
.preview .tipo { color: var(--muted); font-weight: 500; }
.hand { display: flex; gap: 10px 6px; flex-wrap: wrap; justify-content: center; min-height: 52px; padding-top: 8px; }
.htile { width: 44px; height: 48px; border-radius: 8px; background: var(--tile); color: var(--tile-ink); border: none; position: relative; font: 800 24px var(--font-body); cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); transition: transform .12s; }
.htile .v { position: absolute; right: 4px; bottom: 2px; font-size: 10px; font-weight: 700; }
.htile.rune { box-shadow: inset 0 -3px 0 var(--oro); }
.htile.sel { transform: translateY(-6px); outline: 3px solid var(--oro); }
.htile.alch { outline: 3px solid var(--acqua); transform: translateY(-6px); }
.htile.ghost { background: var(--panel2); color: var(--muted); box-shadow: none; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.log { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); max-height: 220px; overflow: auto; }
.log div:first-child { color: var(--text); }
details summary { cursor: pointer; font-weight: 700; color: var(--muted); }
.toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30; background: var(--panel2); border: 1px solid var(--oro); color: var(--text); padding: 10px 16px; border-radius: 12px; font-weight: 700; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.toast.err { border-color: var(--rosso); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; max-height: 75vh; overflow: auto; box-shadow: 0 -10px 30px rgba(0,0,0,.5); }
.sheet .in { max-width: 540px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { margin: 0; font: 700 20px var(--font-display); color: var(--oro); }
.sheet ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.dz-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 1000px) {
  body.wide .wrap { max-width: 1060px; display: grid; grid-template-columns: minmax(0, 540px) minmax(0, 1fr); gap: 20px; align-items: start; }
  body.wide #side { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  body.wide #side h3 { margin: 0; font: 700 20px var(--font-display); color: var(--oro); }
  body.wide .solo-stretto { display: none; }
}
.dz-form .full { grid-column: 1 / -1; }
.dz-form input[type=text] { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
.dz-form input[type=text]::placeholder { text-transform: none; letter-spacing: 0; font-weight: 400; }
.dz-count { font-size: 14px; color: var(--muted); }
.dz-list { display: flex; flex-wrap: wrap; gap: 6px; }
.dz-w { display: inline-flex; align-items: baseline; gap: 5px; padding: 4px 9px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); font: 800 16px var(--font-body); letter-spacing: .04em; color: var(--text); }
button.dz-w { cursor: pointer; min-height: 36px; }
button.dz-w:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
.dz-w small { font-weight: 700; font-size: 11px; color: var(--muted); letter-spacing: 0; }
.dz-w .x { color: var(--oro); }
.dz-w.fuoco { border-color: var(--fuoco); } .dz-w.gelo { border-color: var(--gelo); } .dz-w.acqua { border-color: var(--acqua); } .dz-w.difesa { border-color: var(--terra); }
.dz-key { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.dz-key span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; border: 2px solid var(--c); vertical-align: -1px; }
.winner { text-align: center; font: 700 24px var(--font-display); color: var(--oro); }
@media (prefers-reduced-motion: reduce) { .cell.launch { animation: none; } .htile, .hp > i { transition: none; } }
</style>

</head>
<body>
<div class="wrap" id="app">
  <section id="lobby"></section>
  <section id="game" hidden></section>
  <aside id="side" hidden aria-label="Dizionario"></aside>
</div>
<div id="toast" class="toast" hidden></div>
<div id="sheet" class="sheet" hidden><div class="in" id="sheetIn"></div></div>

<script src="/engine.js"></script>
<script src="/app.js"></script>

</body>
</html>
