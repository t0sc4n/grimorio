<title>Grimorio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: una colonna da telefono. Campo di gioco al centro, avversario sopra, tu e il Grimorio sotto. Un solo aspetto notturno. */
:root {
  color-scheme: dark;
  --bg: #13111d; --panel: #1c1928; --panel2: #262236; --line: #37314f;
  --text: #efeaf7; --muted: #a59ebf;
  --blu: #5b93ff; --rosso: #ff626a; --oro: #f0c05a;
  --tile: #efe3c6; --tile-ink: #2a2116; --tile-pend: #fff3cf;
  --fuoco: #ff8a3d; --gelo: #8fe3ff; --acqua: #4aa6ff; --terra: #86c96b;
  --zA: #19203a; --zB: #2b1923; --zM: #1c1a28; --zS: #2c2414;
  --font-display: "Cinzel Decorative", "Cinzel", Georgia, serif;
  --font-body: "Alegreya Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: auto; }
body {
  background: var(--bg); color: var(--text); font: 16px/1.4 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
}
.wrap { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { font: 700 clamp(30px, 9vw, 44px)/1 var(--font-display); margin: 8px 0 0; letter-spacing: .02em; color: var(--oro); text-wrap: balance; }
h2 { font: 800 13px/1.2 var(--font-body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0; }
p { margin: 0; }
.sub { color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
input[type=text], select {
  min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text);
  padding: 0 12px; font: 500 16px var(--font-body);
}
.check { display: flex; gap: 8px; align-items: center; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--oro); }
.check:has(input:disabled) { opacity: .45; }
.btn {
  min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2);
  color: var(--text); font: 700 15px var(--font-body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; justify-content: center;
}
.btn:focus-visible, .cell:focus-visible, .htile:focus-visible, .gameitem:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
.btn.primary { background: var(--oro); color: #2a1d02; border-color: transparent; }
.btn.danger { color: var(--rosso); }
.btn.on { border-color: var(--fuoco); color: var(--fuoco); background: #2e2018; }
.btn.on.cons { border-color: var(--terra); color: var(--terra); background: #1d2a1b; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.small { min-height: 34px; padding: 0 10px; font-size: 14px; }
.btn.link { background: none; border: none; color: var(--muted); text-decoration: underline; min-height: 32px; padding: 0 4px; }

/* lobby */
.gamelist { display: flex; flex-direction: column; gap: 8px; }
.gameitem { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--text); font: inherit; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.gameitem .vs { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.gameitem .st { font-size: 14px; color: var(--muted); }
.gameitem .tag { grid-row: span 2; align-self: center; font-size: 13px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--zS); color: var(--oro); }
.gameitem .tag.idle { background: transparent; color: var(--muted); }
.dotA { color: var(--blu); } .dotB { color: var(--rosso); }
.fonte { font-size: 12px; margin-top: 4px; } .fonte a { color: var(--muted); }
.note { font-size: 14px; color: var(--muted); }

/* partita */
.topbar { display: flex; align-items: center; gap: 8px; }
.topbar .title { font: 700 20px var(--font-display); color: var(--oro); flex: 1; }
.pbar { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.pbar .nm { font-weight: 800; min-width: 0; overflow-wrap: anywhere; }
.pbar.A .nm { color: var(--blu); } .pbar.B .nm { color: var(--rosso); }
.pbar.turn { border-color: var(--oro); box-shadow: 0 0 0 1px var(--oro) inset; }
.hp { height: 10px; border-radius: 6px; background: var(--panel2); overflow: hidden; }
.hp > i { display: block; height: 100%; border-radius: 6px; transition: width .4s; }
.pbar.A .hp > i { background: var(--blu); } .pbar.B .hp > i { background: var(--rosso); }
.hpn { font-variant-numeric: tabular-nums; font-weight: 800; }
.chips { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.ok { color: var(--oro); border-color: var(--oro); }
.status { text-align: center; font-weight: 800; font-size: 17px; }
.status small { display: block; font-weight: 500; font-size: 14px; color: var(--muted); }

.boardwrap { position: relative; }
.board { display: grid; grid-template-columns: repeat(11, 1fr); gap: 2px; padding: 4px; background: var(--line); border-radius: 10px; touch-action: manipulation; }
.cell { aspect-ratio: 1; position: relative; border-radius: 4px; background: var(--zM); display: grid; place-items: center; cursor: pointer; padding: 0; border: none; color: inherit; font: inherit; min-width: 0; }
.cell.zA { background: var(--zA); } .cell.zB { background: var(--zB); }
.cell.scudo { background-image: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--terra) 22%, transparent) 6px 8px); }
.cell.st { background: var(--zS); }
.cell.st::before { content: ""; position: absolute; left: -2px; right: -2px; top: 50%; height: 1px; background: var(--oro); opacity: .45; }
.mult { font-size: 9px; font-weight: 800; letter-spacing: .02em; color: var(--gelo); opacity: .8; }
.mult.PD { color: var(--oro); }
.tile { position: absolute; inset: 1px; border-radius: 4px; background: var(--tile); color: var(--tile-ink); display: grid; place-items: center; font-weight: 800; font-size: clamp(13px, 4.3vw, 21px); line-height: 1; box-shadow: inset 0 -3px 0 rgba(0,0,0,.22); }
.tile .v { position: absolute; right: 2px; bottom: 1px; font-size: 8px; font-weight: 700; opacity: .75; }
.tile.oA { box-shadow: inset 0 -3px 0 var(--blu); } .tile.oB { box-shadow: inset 0 -3px 0 var(--rosso); }
.tile.fuoco { outline: 2px solid var(--fuoco); outline-offset: -2px; }
.tile.gelo { outline: 2px solid var(--gelo); outline-offset: -2px; }
.tile.acqua { outline: 2px solid var(--acqua); outline-offset: -2px; }
.tile.difesa { outline: 2px solid var(--terra); outline-offset: -2px; }
.tile.consacrata { outline: 2px dashed var(--terra); outline-offset: -2px; }
.tile.pend { background: var(--tile-pend); outline: 2px solid var(--oro); outline-offset: -2px; }
.badge { position: absolute; top: -8px; right: -8px; z-index: 2; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--bg); font-size: 9px; font-weight: 800; line-height: 12px; text-align: center; border: 1px solid currentColor; font-variant-numeric: tabular-nums; }
.badge.difesa, .badge.consacrata { color: var(--terra); } .badge.fuoco { color: var(--fuoco); } .badge.gelo { color: var(--gelo); } .badge.acqua { color: var(--acqua); }
.arr { position: absolute; z-index: 2; width: 14px; height: 14px; border-radius: 7px; background: var(--bg); font-size: 11px; font-weight: 800; line-height: 14px; text-align: center; pointer-events: none; }
.arr.A { color: var(--blu); } .arr.B { color: var(--rosso); } .arr.pend { color: var(--oro); }
.arr.dx { left: -7px; top: calc(50% - 7px); }
.arr.giu { top: -7px; left: -7px; }
.arr.su { bottom: -7px; left: -7px; }
.board.placing { touch-action: none; }
.board.placing .tile.pend { cursor: grab; }
.board.dragging .tile.pend { cursor: grabbing; transform: scale(1.08); box-shadow: 0 6px 14px rgba(0,0,0,.55); z-index: 4; }
.cell.badcell { box-shadow: 0 0 0 2px var(--rosso) inset; }
.cell.launch { outline: 2px solid var(--fuoco); outline-offset: -1px; animation: pulse 1s ease-in-out infinite alternate; z-index: 1; }
.cell .dmg { position: absolute; top: -9px; right: -6px; z-index: 3; background: var(--fuoco); color: #221004; font-size: 11px; font-weight: 800; border-radius: 8px; padding: 0 5px; }
.cell .dmg.zero { background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
.cell.trail { box-shadow: 0 0 0 2px var(--fuoco) inset, 0 0 12px var(--fuoco); z-index: 1; }
.cell.trail .pw { position: absolute; top: -8px; left: -6px; z-index: 3; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--fuoco); color: #221004; font-size: 11px; font-weight: 800; line-height: 18px; text-align: center; }
.cell.hitdef { box-shadow: 0 0 0 2px var(--terra) inset, 0 0 12px var(--terra); }
.cell.origin { box-shadow: 0 0 0 2px var(--oro) inset; }
@keyframes pulse { from { box-shadow: 0 0 0 0 var(--fuoco); } to { box-shadow: 0 0 10px 1px var(--fuoco); } }
.legend { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: var(--c); }

.preview { min-height: 24px; text-align: center; font-weight: 700; }
.preview.err { color: var(--rosso); font-weight: 500; }
.preview .tipo { color: var(--muted); font-weight: 500; }
.hand { display: flex; gap: 10px 6px; flex-wrap: wrap; justify-content: center; min-height: 52px; padding-top: 8px; }
.htile { width: 44px; height: 48px; border-radius: 8px; background: var(--tile); color: var(--tile-ink); border: none; position: relative; font: 800 24px var(--font-body); cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); transition: transform .12s; }
.htile .v { position: absolute; right: 4px; bottom: 2px; font-size: 10px; font-weight: 700; }
.htile.rune { box-shadow: inset 0 -3px 0 var(--oro); }
.htile.sel { transform: translateY(-6px); outline: 3px solid var(--oro); }
.htile.alch { outline: 3px solid var(--acqua); transform: translateY(-6px); }
.htile.ghost { background: var(--panel2); color: var(--muted); box-shadow: none; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.log { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); max-height: 220px; overflow: auto; }
.log div:first-child { color: var(--text); }
details summary { cursor: pointer; font-weight: 700; color: var(--muted); }
.toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30; background: var(--panel2); border: 1px solid var(--oro); color: var(--text); padding: 10px 16px; border-radius: 12px; font-weight: 700; max-width: calc(100vw - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.toast.err { border-color: var(--rosso); }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; max-height: 75vh; overflow: auto; box-shadow: 0 -10px 30px rgba(0,0,0,.5); }
.sheet .in { max-width: 540px; margin: 0 auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { margin: 0; font: 700 20px var(--font-display); color: var(--oro); }
.sheet ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.dz-form { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 1000px) {
  body.wide .wrap { max-width: 1060px; display: grid; grid-template-columns: minmax(0, 540px) minmax(0, 1fr); gap: 20px; align-items: start; }
  body.wide #side { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  body.wide #side h3 { margin: 0; font: 700 20px var(--font-display); color: var(--oro); }
  body.wide .solo-stretto { display: none; }
}
.dz-form .full { grid-column: 1 / -1; }
.dz-form input[type=text] { text-transform: uppercase; letter-spacing: .12em; font-weight: 700; }
.dz-form input[type=text]::placeholder { text-transform: none; letter-spacing: 0; font-weight: 400; }
.dz-count { font-size: 14px; color: var(--muted); }
.dz-list { display: flex; flex-wrap: wrap; gap: 6px; }
.dz-w { display: inline-flex; align-items: baseline; gap: 5px; padding: 4px 9px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); font: 800 16px var(--font-body); letter-spacing: .04em; color: var(--text); }
button.dz-w { cursor: pointer; min-height: 36px; }
button.dz-w:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
.dz-w small { font-weight: 700; font-size: 11px; color: var(--muted); letter-spacing: 0; }
.dz-w .x { color: var(--oro); }
.dz-w.fuoco { border-color: var(--fuoco); } .dz-w.gelo { border-color: var(--gelo); } .dz-w.acqua { border-color: var(--acqua); } .dz-w.difesa { border-color: var(--terra); }
.dz-key { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.dz-key span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; border: 2px solid var(--c); vertical-align: -1px; }
.winner { text-align: center; font: 700 24px var(--font-display); color: var(--oro); }
@media (prefers-reduced-motion: reduce) { .cell.launch { animation: none; } .htile, .hp > i { transition: none; } }
</style>

<div class="wrap" id="app">
  <section id="lobby"></section>
  <section id="game" hidden></section>
  <aside id="side" hidden aria-label="Dizionario"></aside>
</div>
<div id="toast" class="toast" hidden></div>
<div id="sheet" class="sheet" hidden><div class="in" id="sheetIn"></div></div>

<script src="engine.js"></script>
<script>
"use strict";
const G = window.Grimorio;
const BASE = G.PRESETS.v5f; // v5e + lettura dal lato (campo girato per ciascun giocatore)
// regole da mostrare: quelle della partita aperta, altrimenti quelle scelte nel menu "Regole"
function regoleAttive() {
  if (S() && S().cfg) return S().cfg;
  const sel = document.getElementById("regole");
  return ((sel && REGOLE[sel.value]) || REGOLE.s1).cfg;
}
const REGOLE = { s1: { cfg: G.PRESETS.s1, nome: "Semplificate (s1)", pv: [40, 60, 80], def: 60 }, v5f: { cfg: G.PRESETS.v5f, nome: "Classiche (con lessico)", pv: [20, 25, 30], def: 30 } };
const NOMI = { A: "Mago Blu", B: "Mago Rosso" };
const EL = { fuoco: "Fuoco", gelo: "Gelo", acqua: "Acqua", terra: "Terra" };

// ---------- piccoli aiuti ----------
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "style") e.style.cssText = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
// sostituisce il contenuto ignorando gli elementi assenti (null, false)
function fill(el, ...kids) { el.replaceChildren(...kids.flat().filter(k => k !== null && k !== undefined && k !== false)); }
const store = {
  // le chiavi salvate prima della correzione del nome (Grimorio) restano leggibili
  get(k, d) { try { let v = localStorage.getItem(k); if (v === null) v = localStorage.getItem(k.replace("grimorio", "grimon" + "io")); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let toastT = null;
function toast(msg, err) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, err ? 4200 : 3000);
}
function sheet(title, body) {
  const s = document.getElementById("sheet"), inn = document.getElementById("sheetIn");
  inn.replaceChildren(h("h3", { text: title }), ...body, h("button", { class: "btn", onclick: closeSheet, text: "Chiudi" }));
  s.hidden = false;
}
function closeSheet() { document.getElementById("sheet").hidden = true; }

// ---------- dizionario ----------
let dictState = "carico";
let DICT_TEXT = "", DICT_OFFS = null;
function makeDict(text) {
  const offs = [0];
  for (let i = 0; i < text.length; i++) if (text.charCodeAt(i) === 10) offs.push(i + 1);
  const o = Uint32Array.from(offs), n = o.length;
  DICT_TEXT = text; DICT_OFFS = o;
  const line = i => text.slice(o[i], i + 1 < n ? o[i + 1] - 1 : text.length);
  return { has(w) { let lo = 0, hi = n - 1; while (lo <= hi) { const m = (lo + hi) >> 1, x = line(m); if (x === w) return true; if (x < w) lo = m + 1; else hi = m - 1; } return false; } };
}
async function loadDict() {
  try {
    const res = await fetch("parole.txt");
    if (!res.ok) throw new Error("http " + res.status);
    const buf = new Uint8Array(await res.arrayBuffer());
    let text;
    if (buf[0] === 0x1f && buf[1] === 0x8b) text = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    else text = new TextDecoder().decode(buf);
    G.setDict(makeDict(text.replace(/\r/g, "").trim()));
    dictState = "pronto";
  } catch (e) { dictState = "errore"; }
  render();
}

// ---------- identità e archivio ----------
let DB = null, USER = null, MYID = null, CANWRITE = null, conn = "collego", LOCAL = false;
let games = {}, localGames = {};
let cur = null;       // { id, data }
let unsubGame = null;
let pendingOpen = null;

function myName() { return store.get("grimorio-nome", "") || ""; }
function localToken() {
  let t = store.get("grimorio-token", null);
  if (!t) { t = "t" + Math.random().toString(36).slice(2) + Date.now().toString(36); store.set("grimorio-token", t); }
  return t;
}
async function init() {
  render(); loadDict();
  const c = window.claude;
  if (c && c.use) {
    try { [DB, USER] = await Promise.all([c.use("db"), c.use("user")]); } catch (e) { DB = null; }
  }
  if (USER) { try { MYID = await USER.id(); } catch (e) {} try { CANWRITE = await USER.can("data.write"); } catch (e) {} }
  if (!MYID) MYID = localToken();
  if (DB) subscribeLobby(); else { LOCAL = true; conn = "locale"; localGames = store.get("grimorio-locali", {}); games = localGames; }
  const hash = location.hash.slice(1);
  if (hash) pendingOpen = hash;
  render(); tryPendingOpen();
}
function subscribeLobby() {
  const timer = setTimeout(() => { if (conn === "collego") { conn = "lento"; render(); } }, 10000);
  DB.collection("partite").onSnapshot(snap => {
    clearTimeout(timer);
    const g = {}; snap.docs.forEach(d => { g[d.id] = d.data(); });
    games = g; if (!snap.metadata.fromCache) conn = "ok"; else if (conn === "collego") conn = "ok";
    render(); tryPendingOpen();
  }, err => { clearTimeout(timer); conn = "errore"; render(); });
}
function tryPendingOpen() { if (pendingOpen && games[pendingOpen]) { const id = pendingOpen; pendingOpen = null; openGame(id); } }
function saveLocal() { store.set("grimorio-locali", localGames); }
function errText(e) {
  if (e && e.code === "invalid_argument") return "Non hai il permesso di salvare: chiedi al proprietario di invitarti come Editor.";
  if (e && e.code === "quota_exceeded") return "Lo spazio delle partite è pieno: elimina qualche partita finita.";
  return "Salvataggio non riuscito. Riprova tra poco.";
}
async function writeGame(id, data) {
  data = JSON.parse(JSON.stringify(data)); // solo JSON puro: niente valori undefined
  if (LOCAL) { localGames[id] = data; saveLocal(); games = localGames; if (cur && cur.id === id) onGameData(data); render(); return; }
  await DB.doc("partite/" + id).set(data);
}

// ---------- stato dell'interfaccia ----------
let ui = freshUi();
function freshUi() { return { place: null, pending: [], sel: null, mode: null, launch: null, alch: null, passConfirm: false, hintConfirm: false, hintLaunch: null, delConfirm: false, claimConfirm: null, busy: false, order: null }; }
let anim = null;

function S() { return cur && cur.data && cur.data.s; }
function mySeat() {
  const s = S(); if (!s) return null;
  const a = s.seats.A && s.seats.A.tok === MYID, b = s.seats.B && s.seats.B.tok === MYID;
  if (a && b) return s.turn;
  return a ? "A" : b ? "B" : null;
}
function viewSeat() { return mySeat() || "A"; }

let aiWorker = null, aiBusy = false;
function cpuTurn() {

  const seat = s.seats[s.turn], other = s.seats[G.enemy(s.turn)];
  return !!(seat && seat.cpu && other && other.tok === MYID); // solo il client dell'umano fa muovere il computer
}
function maybeRunCpu() {

  const s = S(), id = cur.id, moveNo = s.moveNo, started = Date.now();
  aiBusy = true; render();
  try { if (!aiWorker) aiWorker = new Worker("ai.js"); }
  catch (e) { aiBusy = false; toast("Il giocatore automatico non si avvia in questo browser.", true); render(); return; }
  aiWorker.onmessage = ev => {
    const m = ev.data;
    setTimeout(() => {
      aiBusy = false;

      if (m.kind === "errore") { toast("Il giocatore automatico ha avuto un problema: " + m.message, true); render(); return; }
      const s2 = S(), p = s2.turn;

// SUGGERIMENTO-FINE

function applyHint(m) {

  if (!m || m.kind === "errore") { toast("Il suggeritore ha avuto un problema" + (m && m.message ? ": " + m.message : "."), true); render(); return; }

    const come = ui.mode === "attacca" || (v.ok && v.type === "attacco") ? ", da lanciare" : ui.mode === "falo" ? ", come Grande Falò" : ui.mode === "consacra" ? ", da consacrare" : "";

// ---------- parola intera dal dizionario (si trascina) ----------
let drag = null, suppressClick = false;
// passo di scrittura: in verticale dall'alto in basso come vedi il campo tu
function stepFor(dir) {
  const s = S(), me = mySeat();
  return dir === "v" ? [((s.cfg && s.cfg.letturaDalLato && me === "A") ? -1 : 1), 0] : [0, 1];
}
// dove finirebbero le lettere della parola partendo da (r0, c0); non controlla il dizionario
function computePlacement(w, dir, r0, c0) {
  const s = S(), me = mySeat(), [dr, dc] = stepFor(dir);
  const hand = s.hands[me], usedIdx = new Set(), pend = [];
  for (let i = 0; i < w.length; i++) {
    const r = r0 + dr * i, c = c0 + dc * i;
    if (r < 0 || r >= G.ROWS || c < 0 || c >= G.COLS) return { err: "«" + w + "» da qui esce dal campo." };
    const t = s.tiles[G.key(r, c)];
    if (t) { if (t.l !== w[i]) return { err: "In quella posizione c'è già una " + t.l + ", ma serviva una " + w[i] + "." }; continue; }
    let hi = -1;
    for (let j = 0; j < hand.length; j++) if (!usedIdx.has(j) && hand[j] === w[i]) { hi = j; break; }
    if (hi < 0) return { err: "Ti manca una " + w[i] + " per scrivere «" + w + "» qui." };
    usedIdx.add(hi); pend.push({ r, c, l: w[i], hi, i });
  }

// la posizione valida più vicina a (r0, c0)

  const cand = [];
  for (let r = 0; r < G.ROWS; r++) for (let c = 0; c < G.COLS; c++) cand.push([Math.abs(r - r0) + Math.abs(c - c0), r, c]);
  cand.sort((x, y) => x[0] - y[0]);
  // prima scelta: la più vicina che rispetta anche le regole; altrimenti la più vicina dove entra
  let fallback = null;
  for (const [, r, c] of cand) {
    const res = computePlacement(w, dir, r, c); if (!res.pend) continue;
    if (!fallback) fallback = { r, c, pend: res.pend };
    if (dictState === "pronto" && G.validate(S(), mySeat(), res.pend.map(x => ({ r: x.r, c: x.c, l: x.l })), {}).ok) return { r, c, pend: res.pend };
  }
  return fallback;
}
function setPlacement(r, c, pend) { ui.pending = pend; ui.place.start = G.key(r, c); ui.sel = null; }
function startPlace(word) {
  closeSheet();
  const s = S(), me = mySeat();
  ui.place = { word, dir: "h", start: null }; ui.pending = []; ui.mode = null; ui.sel = null; ui.launch = null; ui.alch = null;
  // parte dal centro del proprio Sanctum
  const rows = []; for (let r = 0; r < G.ROWS; r++) if (G.zoneOf(r) === me) rows.push(r);
  const r0 = rows[1], c0 = Math.max(0, 5 - Math.floor(word.length / 2));

  if (!found) { ui.place.dir = "v"; found = nearestPlacement(word, "v", r0, 5); }
  if (found) { setPlacement(found.r, found.c, found.pend); toast("Trascina «" + word + "» dove vuoi. ↻ Gira la mette in verticale."); }
  else toast("Non c'è spazio sul campo per «" + word + "» con le tue lettere.", true);
  render();
}
function placeWordAt(k) {
  const [r, c] = G.parse(k);
  const res = computePlacement(ui.place.word, ui.place.dir, r, c);
  if (res.err) { toast(res.err + " Prova un'altra casella o girala.", true); return; }
  setPlacement(r, c, res.pend); render();
}
function rotatePlace() {
  const old = ui.place.dir;
  ui.place.dir = old === "h" ? "v" : "h";
  if (!ui.place.start) { render(); return; }
  const [r, c] = G.parse(ui.place.start);
  const found = nearestPlacement(ui.place.word, ui.place.dir, r, c);
  if (found) setPlacement(found.r, found.c, found.pend);
  else { ui.place.dir = old; toast("Girata, «" + ui.place.word + "» non entra da nessuna parte.", true); }
  render();

function cancelPlace() { ui.place = null; ui.pending = []; ui.mode = null; render(); }
// trascinamento: si prende la parola da una sua lettera
function onBoardPointerDown(e) {
  if (!ui.place || !myTurn() || ui.busy) return;
  const cell = e.target.closest && e.target.closest(".cell"); if (!cell) return;
  const k = cell.dataset.k, p = ui.pending.find(x => G.key(x.r, x.c) === k);
  if (!p) return;
  e.preventDefault();
  drag = { i: p.i, lastK: k, err: null, bad: null };
  suppressClick = true;
  window.addEventListener("pointermove", onDragMove);
  window.addEventListener("pointerup", onDragEnd, { once: true });
  window.addEventListener("pointercancel", onDragEnd, { once: true });
  render();
}
function onDragMove(e) {
  if (!drag) return;
  const el = document.elementFromPoint(e.clientX, e.clientY), cell = el && el.closest && el.closest(".board .cell");
  if (!cell) return;
  const k = cell.dataset.k; if (k === drag.lastK) return;
  drag.lastK = k;
  const [r, c] = G.parse(k), [dr, dc] = stepFor(ui.place.dir);
  const r0 = r - dr * drag.i, c0 = c - dc * drag.i;
  const res = computePlacement(ui.place.word, ui.place.dir, r0, c0);
  if (res.err) { drag.err = res.err; drag.bad = k; }
  else { drag.err = null; drag.bad = null; setPlacement(r0, c0, res.pend); }
  render();
}
function onDragEnd() {
  window.removeEventListener("pointermove", onDragMove);

  const d = drag; drag = null;
  if (d.err) toast(d.err + " La parola resta nell'ultima posizione valida.", true);
  render();
  setTimeout(() => { suppressClick = false; }, 50);
}

// mosse
function placed() { return ui.pending.map(p => ({ r: p.r, c: p.c, l: p.l })); }
function opts() { return { falo: ui.mode === "falo", consacra: ui.mode === "consacra", attacca: ui.mode === "attacca" }; }
async function commit(newS) {

  try { await writeGame(cur.id, data); }
  catch (e) { toast(errText(e), true); }

}
function onConfirm() {

  if (!v.ok) return toast(v.err, true);
  if (v.type === "attacco") {
    const pv = G.previewLaunches(s, p, placed());
    const keys = Object.keys(pv || {});
    if (ui.hintLaunch && keys.includes(ui.hintLaunch)) return doPlay({ launch: ui.hintLaunch });
    if (keys.length === 1) return doPlay({ launch: keys[0] });
    ui.launch = pv; render();
    if (keys.every(k => !pv[k])) return toast("Da qui l'incantesimo si dissolve prima di arrivare al mago: danno previsto 0 da ogni lettera.", true);
    return toast("Scegli la lettera da cui lanciare l'incantesimo: il numero è il danno previsto.");
  }

}
function doPlay(extra) {

function onCell(k) {

  if (suppressClick) return;
  if (ui.place && myTurn()) { placeWordAt(k); return; }
  const pi = ui.pending.findIndex(p => G.key(p.r, p.c) === k);
  if (myTurn() && !ui.alch && pi >= 0) { ui.pending.splice(pi, 1); render(); return; }

  if (ui.sel === null) return toast("Tocca prima una lettera del tuo Grimorio.");
  const [r, c] = G.parse(k);

  ui.sel = null; render();
}
function onHand(i) {
  if (!myTurn() || ui.launch) return;
  if (ui.alch) { const j = ui.alch.indexOf(i); if (j >= 0) ui.alch.splice(j, 1); else ui.alch.push(i); render(); return; }
  if (ui.place) ui.place = null; // si torna alla posa lettera per lettera

function searchWords(hand, extra, tipo, ordine, max) {
  const total = hand.length + extra.length;
  if (!DICT_OFFS || total < 2) return { list: [], total: 0 };
  const avail = new Int16Array(26), fromHand = new Int16Array(26), used = new Int16Array(26);
  for (const l of hand) { avail[l.charCodeAt(0) - 65]++; fromHand[l.charCodeAt(0) - 65]++; }
  for (const l of extra) avail[l.charCodeAt(0) - 65]++;

  for (let i = 0; i < n; i++) {
    const a = O[i], b = i + 1 < n ? O[i + 1] - 1 : T.length;
    if (b - a > total || b - a < 2) continue;
    let ok = true, j = a;
    for (; j < b; j++) { const c = T.charCodeAt(j) - 65; if (++used[c] > avail[c]) { ok = false; j++; break; } }
    for (let x = a; x < j; x++) used[T.charCodeAt(x) - 65] = 0;
    if (ok) words.add(T.slice(a, b));
  }
  for (const el in G.LESSICO) for (const w of G.LESSICO[el].split(" ")) {
    const cnt = new Int16Array(26); let ok = w.length <= total;
    for (const ch of w) if (++cnt[ch.charCodeAt(0) - 65] > avail[ch.charCodeAt(0) - 65]) ok = false;
    if (ok) words.add(w);
  }
  const list = [];
  for (const w of words) {
    const cls = G.classify(w);
    const kind = cls.type === "attacco" ? cls.el : cls.type;
    if (tipo === "attacco" ? cls.type !== "attacco" : tipo !== "tutte" && kind !== tipo) continue;

    for (const ch of w) { const c = ch.charCodeAt(0) - 65; if (++cnt[c] > fromHand[c]) extraUsed += ch; score += G.VAL[ch]; }
    list.push({ w, kind, score, extraUsed });
  }
  list.sort(ordine === "lunghezza" ? (x, y) => y.w.length - x.w.length || y.score - x.score : (x, y) => y.score - x.score || y.w.length - x.w.length);
  return { list: list.slice(0, max), total: list.length };
}

    if (ui.launch && k in ui.launch) kids.push(h("span", { class: "dmg" + (ui.launch[k] ? "" : " zero"), text: ui.launch[k] }));
    if (trail[k] && !hit[k]) kids.push(h("span", { class: "pw", text: trail[k].power }));
    const label = "Riga " + (r + 1) + ", colonna " + (c + 1) + (t ? ", lettera " + t.l : pend[k] ? ", lettera " + pend[k] + " in posa" : ", vuota");
    cells.push(h("button", { class: cls.filter(Boolean).join(" "), "data-k": k, "aria-label": label, onclick: () => onCell(k) }, kids));
  }
  return h("div", { class: "board" + (ui.place && ui.pending.length ? " placing" : "") + (drag ? " dragging" : ""), role: "grid", "aria-label": "Campo di battaglia", onpointerdown: onBoardPointerDown }, cells);
}
function renderGame() {
  const Gm = document.getElementById("game");
  const s = S();
  if (!s) { Gm.replaceChildren(h("div", { class: "topbar" }, h("button", { class: "btn small", onclick: leaveGame, text: "← Partite" })), h("p", { class: "note", text: "Carico la partita…" })); return; }
  const me = mySeat(), view = viewSeat(), opp = G.enemy(view), top = topSeat();
  const both = s.seats.A && s.seats.B && s.seats.A.tok === s.seats.B.tok && s.seats.A.tok === MYID;
  // stato
  let status, sub = "";
  if (s.winner) status = "Vince " + seatName(s, s.winner) + "!";
  else if (!s.seats.B) { status = me === "A" ? "In attesa dello sfidante" : "Il posto del Mago Rosso è libero"; sub = me === "A" ? "Invita qualcuno: vedi «Come sfidare qualcuno a distanza» nella pagina delle partite." : ""; }
  else if (myTurn()) { status = both ? "Turno del " + NOMI[s.turn] : "Tocca a te"; sub = s.first[me] ? "Primo turno: scrivi nel tuo Sanctum (" + (me === top ? "in alto" : "in basso") + ")." : both ? "Modalità prova: giochi entrambi i maghi." : ""; }
  else if (me && s.seats[s.turn] && s.seats[s.turn].cpu) { status = seatName(s, s.turn) + " sta pensando…"; sub = "Il computer gioca dal tuo dispositivo: resta su questa pagina."; }
  else if (me) { status = "Tocca a " + seatName(s, s.turn); sub = "Puoi chiudere la pagina: la partita ti aspetta."; }
  else status = "Stai guardando: tocca a " + seatName(s, s.turn);

  // mano
  const hand = me ? s.hands[me] : [];
  const usedIdx = new Set(ui.pending.map(p => p.hi));
  let order = ui.order && ui.order.length === hand.length ? ui.order : hand.map((_, i) => i);
  const handEl = me ? h("div", { class: "hand", role: "group", "aria-label": "Il tuo Grimorio" }, order.map(i => {
    const l = hand[i], used = usedIdx.has(i);
    const cls = ["htile", G.VAL[l] >= 3 ? "rune" : "", ui.sel === i ? "sel" : "", ui.alch && ui.alch.includes(i) ? "alch" : "", used ? "ghost" : ""].filter(Boolean).join(" ");
    return h("button", { class: cls, disabled: used || !myTurn(), "aria-pressed": ui.sel === i, "aria-label": "Lettera " + l + ", valore " + G.VAL[l], onclick: () => onHand(i) }, l, h("span", { class: "v", text: G.VAL[l] }));
  })) : null;

  // pulsanti
  const actions = [];
  const turn = myTurn() && !ui.busy;
  if (turn && ui.launch) actions.push(h("button", { class: "btn", onclick: () => { ui.launch = null; render(); }, text: "Annulla lancio" }));
  else if (turn && ui.alch) {
    actions.push(h("button", { class: "btn", onclick: () => { ui.alch = null; render(); }, text: "Annulla" }));
    actions.push(h("button", { class: "btn small", onclick: () => { ui.alch = hand.map((_, i) => i); render(); }, text: "Tutte" }));
    actions.push(h("button", { class: "btn primary", disabled: !ui.alch.length, onclick: doAlchimia, text: "Cambia " + ui.alch.length + " lettere" }));
  } else if (turn && ui.place && !ui.pending.length) {
    actions.push(h("button", { class: "btn", onclick: cancelPlace, text: "Annulla" }));
    actions.push(h("button", { class: "btn", onclick: rotatePlace, text: "↻ Gira (" + (ui.place.dir === "h" ? "ora orizzontale" : "ora verticale") + ")" }));
  } else if (turn && ui.pending.length) {
    const pv = previewLine();
    actions.push(h("button", { class: "btn", onclick: () => { ui.pending = []; ui.mode = null; ui.place = null; render(); }, text: "Ritira" }));
    if (ui.place) actions.push(h("button", { class: "btn", "aria-label": "Gira la parola", onclick: rotatePlace, text: "↻ Gira" }));
    if (s.cfg && s.cfg.attaccoLibero) actions.push(h("button", { class: "btn" + (ui.mode === "attacca" ? " on" : ""), "aria-pressed": ui.mode === "attacca", onclick: () => { ui.mode = ui.mode === "attacca" ? null : "attacca"; render(); }, text: "Attacca" }));
    actions.push(h("button", { class: "btn" + (ui.mode === "falo" ? " on" : ""), "aria-pressed": ui.mode === "falo", onclick: () => { ui.mode = ui.mode === "falo" ? null : "falo"; render(); }, text: "Falò" }));
    if (s.cfg && s.cfg.consacrazione) actions.push(h("button", { class: "btn" + (ui.mode === "consacra" ? " on cons" : ""), "aria-pressed": ui.mode === "consacra", onclick: () => { ui.mode = ui.mode === "consacra" ? null : "consacra"; render(); }, text: "Consacra" }));
    actions.push(h("button", { class: "btn primary", disabled: !pv || pv.err, onclick: onConfirm, text: "Conferma" }));
  } else if (turn) {
    actions.push(h("button", { class: "btn small", onclick: () => { const o = hand.map((_, i) => i); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } ui.order = o; ui.sel = null; render(); }, text: "Mescola" }));
    actions.push(h("button", { class: "btn small", onclick: () => { ui.alch = []; ui.sel = null; render(); }, text: "Alchimia" }));
    const costo = (s.cfg && s.cfg.costoSuggerimento) || 3;
    actions.push(ui.hintConfirm
      ? h("button", { class: "btn small danger", onclick: () => { ui.hintConfirm = false; askHint(); }, text: "Sì, suggerisci (−" + costo + " PV)" })
      : h("button", { class: "btn small", disabled: hintBusy || s.hp[mySeat()] <= costo, title: "Il computer ti propone la mossa migliore: costa " + costo + " PV", onclick: () => { ui.hintConfirm = true; render(); setTimeout(() => { ui.hintConfirm = false; render(); }, 4000); }, text: hintBusy ? "Ci penso…" : "Suggerisci" }));
    actions.push(ui.passConfirm
      ? h("button", { class: "btn small danger", onclick: doPass, text: "Sì, passa il turno" })
      : h("button", { class: "btn small", onclick: () => { ui.passConfirm = true; render(); setTimeout(() => { ui.passConfirm = false; render(); }, 4000); }, text: "Passa" }));
  }
  const pv = previewLine();
  const seatBtns = [];
  if (!me && !s.winner) for (const p of ["A", "B"]) {
    if (!s.seats[p]) seatBtns.push(h("button", { class: "btn primary", disabled: CANWRITE === false, onclick: () => sitDown(p), text: "Siediti come " + NOMI[p] }));
  }
  if (!me && s.seats.A && s.seats.B && !s.winner) {
    seatBtns.push(ui.claimConfirm
      ? h("div", { class: "row" }, ["A", "B"].map(p => h("button", { class: "btn small", onclick: () => sitDown(p), text: "Sono " + seatName(s, p) })))
      : h("button", { class: "btn link", onclick: () => { ui.claimConfirm = true; render(); }, text: "Stai già giocando questa partita da un altro dispositivo?" }));
  }

  fill(Gm, 
    h("div", { class: "topbar" },
      h("button", { class: "btn small", onclick: leaveGame, text: "← Partite" }),
      h("span", { class: "title", text: "Grimorio" }),
      h("button", { class: "btn small", onclick: showRules, text: "Regole" })),
    pbar(s, top),
    h("div", { class: "boardwrap" }, boardEl(s)),
    h("div", { class: "legend" },
      h("span", { style: "--c:var(--z" + top + ")", text: "▲ Sanctum " + (top === "A" ? "Blu" : "Rosso") + (me === top && !both ? " (tuo)" : "") }),
      h("span", { style: "--c:var(--zS)", text: "Passo Arcano · → ↓ ↑ verso di lettura" }),
      h("span", { style: "--c:var(--z" + G.enemy(top) + ")", text: "▼ Sanctum " + (top === "A" ? "Rosso" : "Blu") + (me === G.enemy(top) && !both ? " (tuo)" : "") })),
    pbar(s, G.enemy(top)),
    h("p", { class: "status" }, status, sub ? h("small", { text: sub }) : null),
    s.winner ? h("p", { class: "winner", text: "✦ " + seatName(s, s.winner) + " ✦" }) : null,
    seatBtns.length ? h("div", { class: "actions" }, seatBtns) : null,
    pv ? h("p", { class: "preview" + (pv.err ? " err" : "") }, pv.text, pv.tipo ? h("span", { class: "tipo", text: " · " + pv.tipo }) : null) : (me && myTurn() ? h("p", { class: "preview" }, h("span", { class: "tipo", text: ui.sel !== null ? "Ora tocca una casella del campo" : "Tocca una lettera, poi una casella" })) : null),
    handEl,
    actions.length ? h("div", { class: "actions" }, actions) : null,
    h("div", { class: "actions" }, h("button", { class: "btn small solo-stretto", onclick: showExplorer, text: "Esplora il dizionario" })),
    dictState === "carico" && me ? h("p", { class: "note", style: "text-align:center", text: "Carico il dizionario (750.000 parole)…" }) : null,
    h("details", { class: "card" }, h("summary", { text: "Cronaca della partita" }), h("div", { class: "log" }, s.log.slice().reverse().map(m => h("div", { text: m })))),
    me ? (ui.delConfirm
      ? h("div", { class: "actions" }, h("button", { class: "btn small", onclick: () => { ui.delConfirm = false; render(); }, text: "Annulla" }), h("button", { class: "btn small danger", onclick: deleteGame, text: "Elimina per sempre" }))
      : h("div", { class: "actions" }, h("button", { class: "btn link", onclick: () => { ui.delConfirm = true; render(); }, text: "Elimina partita" }))) : null
  );
}

function render() {
  const inGame = !!cur;
  document.getElementById("lobby").hidden = inGame;
  document.getElementById("game").hidden = !inGame;
  if (inGame) renderGame(); else renderLobby();
  updateSide();
}
document.getElementById("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && games[id] && (!cur || cur.id !== id)) openGame(id); });
init();
</script>
