<title>Grimorio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: una colonna da telefono. Campo di gioco al centro, avversario sopra, tu e il Grimorio sotto. Un solo aspetto notturno. */
[hidden] { display: none !important; }
:root {
  color-scheme: dark;
  --bg: #12101b; --panel: #1b1827; --panel2: #252136; --line: #383252;
  --text: #efeaf7; --muted: #a8a1c2;
  --blu: #5b93ff; --rosso: #ff626a; --oro: #f0c05a;
  --tile: #efe3c6; --tile-ink: #2a2116; --tile-pend: #fff3cf;
  --fuoco: #ff8a3d; --gelo: #8fe3ff; --acqua: #4aa6ff; --terra: #86c96b;
  --zA: #19203a; --zB: #2b1923; --zM: #1c1a28; --zS: #2c2414;
  --font-display: "Cinzel Decorative", "Cinzel", Georgia, serif;
  --font-body: "Alegreya Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html, body { height: auto; }
body {
  background: radial-gradient(ellipse 90% 320px at 50% -90px, rgba(240,192,90,.09), transparent 70%), var(--bg);
  color: var(--text); font: 16px/1.4 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 24px;
}
.wrap { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
#lobby { display: flex; flex-direction: column; gap: 12px; }
#game { display: flex; flex-direction: column; gap: 7px; }
h1 { font: 700 clamp(30px, 9vw, 42px)/1 var(--font-display); margin: 2px 0 0; letter-spacing: .02em; color: var(--oro); text-wrap: balance; }
h2 { font: 700 17px/1.2 var(--font-display); letter-spacing: .03em; color: var(--oro); margin: 0; }
p { margin: 0; }
.sub { color: var(--muted); }
.hero { display: flex; flex-direction: column; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid color-mix(in srgb, var(--oro) 28%, transparent); }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hero-runes { display: inline-flex; gap: 4px; user-select: none; }
.rmini {
  width: 25px; height: 29px; border-radius: 6px; background: var(--tile); color: var(--tile-ink);
  display: grid; place-items: center; position: relative; font: 800 15px/1 var(--font-body);
  box-shadow: 0 2px 6px rgba(0,0,0,.35), inset 0 -2px 0 var(--c, rgba(0,0,0,.22));
}
.rmini:nth-child(odd) { transform: rotate(-2.5deg); }
.rmini:nth-child(even) { transform: rotate(2deg) translateY(1px); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.form2 { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(108px, 1fr); gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; min-width: 0; }
label.field, div.field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
input[type=text], select {
  min-height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text);
  padding: 0 12px; font: 500 16px var(--font-body); width: 100%; box-sizing: border-box;
}
.check { display: flex; gap: 8px; align-items: center; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--oro); flex-shrink: 0; }
.check:has(input:disabled) { opacity: .45; }
.btn {
  min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2);
  color: var(--text); font: 700 15px var(--font-body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; justify-content: center;
}
.btn:focus-visible, .cell:focus-visible, .htile:focus-visible, .gameitem:focus-visible { outline: 2px solid var(--oro); outline-offset: 2px; }
.btn.primary { background: var(--oro); color: #2a1d02; border-color: transparent; }
.btn.danger { color: var(--rosso); }
.btn.on { border-color: var(--fuoco); color: var(--fuoco); background: #2e2018; }
.btn.on.cons { border-color: var(--terra); color: var(--terra); background: #1d2a1b; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.small { min-height: 34px; padding: 0 10px; font-size: 14px; }
.btn.link { background: none; border: none; color: var(--muted); text-decoration: underline; min-height: 32px; padding: 0 4px; }

/* lobby */
.gamelist { display: flex; flex-direction: column; gap: 8px; }
.gameitem { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; color: var(--text); font: inherit; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
.gameitem .vs { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.gameitem .st { font-size: 14px; color: var(--muted); }
.gameitem .tag { grid-row: span 2; align-self: center; font-size: 13px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--zS); color: var(--oro); }
.gameitem .tag.idle { background: transparent; color: var(--muted); }
.dotA { color: var(--blu); } .dotB { color: var(--rosso); }
.fonte { font-size: 12px; margin-top: 2px; } .fonte a { color: var(--muted); }
.note { font-size: 14px; color: var(--muted); }

/* partita */
.topbar { display: flex; align-items: center; gap: 6px; }
.topbar .title { font: 700 20px var(--font-display); color: var(--oro); flex: 1; text-align: center; min-width: 0; }
.topctrl { display: flex; gap: 6px; align-items: center; }
.btn.icon { min-width: 34px; padding: 0 8px; }
.btn.icon.on { border-color: var(--oro); color: var(--oro); background: transparent; }
.pbar { position: relative; display: grid; grid-template-columns: auto 1fr auto; gap: 3px 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; }
.pbar .nm { font-weight: 800; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.pbar.A .nm { color: var(--blu); } .pbar.B .nm { color: var(--rosso); }
.pbar.turn { border-color: var(--oro); box-shadow: 0 0 0 1px var(--oro) inset; }
.pbar.hit-fire { border-color: var(--fuoco); box-shadow: 0 0 0 1px var(--fuoco) inset, 0 0 22px rgba(255, 92, 36, .48); animation: hitShake .48s ease-out; }
.hit-dmg {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%); z-index: 6; pointer-events: none;
  padding: 2px 9px; border-radius: 999px; background: linear-gradient(135deg, #ff6a2b, #e02935); color: #fff;
  font-size: 13px; font-weight: 800; box-shadow: 0 4px 14px rgba(255, 80, 30, .65);
  animation: dmgPop .5s cubic-bezier(.2, 1.4, .4, 1) both;
}
.hp { height: 8px; border-radius: 5px; background: var(--panel2); overflow: hidden; }
.hp > i { display: block; height: 100%; border-radius: 5px; transition: width .4s; }
.pbar.A .hp > i { background: var(--blu); } .pbar.B .hp > i { background: var(--rosso); }
.hpn { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 15px; }
.chips { grid-column: 1 / -1; display: flex; gap: 5px; flex-wrap: wrap; }
.chip { font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.ok { color: var(--oro); border-color: color-mix(in srgb, var(--oro) 65%, transparent); background: rgba(240,192,90,.08); }
.status { text-align: center; font-weight: 800; font-size: 16px; line-height: 1.25; }
.status small { display: block; font-weight: 500; font-size: 13.5px; color: var(--muted); }

.boardwrap { position: relative; width: 100%; }
.board {
  display: grid; grid-template-columns: repeat(11, 1fr); gap: 2px; padding: 6px;
  background: var(--line); border-radius: 12px; touch-action: manipulation;
  box-shadow: 0 6px 20px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.04);
}
.cell { aspect-ratio: 1; position: relative; border-radius: 4px; background: var(--zM); display: grid; place-items: center; cursor: pointer; padding: 0; border: none; color: inherit; font: inherit; min-width: 0; }
.cell.zA { background: var(--zA); } .cell.zB { background: var(--zB); }
.cell.scudo { background-image: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--terra) 22%, transparent) 6px 8px); }
.cell.st { background: var(--zS); }
.cell.st::before { content: ""; position: absolute; left: -2px; right: -2px; top: 50%; height: 1px; background: var(--oro); opacity: .45; }
.mult { font-size: 9px; font-weight: 800; letter-spacing: .02em; color: var(--gelo); opacity: .85; }
.mult.PD { color: var(--oro); }
.tile { position: absolute; inset: 1px; border-radius: 4px; background: var(--tile); color: var(--tile-ink); display: grid; place-items: center; font-weight: 800; font-size: clamp(13px, 4.3vw, 21px); line-height: 1; box-shadow: inset 0 -3px 0 rgba(0,0,0,.22); }
.tile .v { position: absolute; right: 2px; bottom: 1px; font-size: 8px; font-weight: 700; opacity: .75; }
.tile.oA { box-shadow: inset 0 -3px 0 var(--blu); } .tile.oB { box-shadow: inset 0 -3px 0 var(--rosso); }
.tile.fuoco { outline: 2px solid var(--fuoco); outline-offset: -2px; }
.tile.gelo { outline: 2px solid var(--gelo); outline-offset: -2px; }
.tile.acqua { outline: 2px solid var(--acqua); outline-offset: -2px; }
.tile.difesa { outline: 2px solid var(--terra); outline-offset: -2px; }
.tile.consacrata { outline: 2px dashed var(--terra); outline-offset: -2px; }
.tile.pend { background: var(--tile-pend); outline: 2px solid var(--oro); outline-offset: -2px; }
.badge { position: absolute; top: -6px; right: -5px; z-index: 2; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--bg); font-size: 9px; font-weight: 800; line-height: 12px; text-align: center; border: 1px solid currentColor; font-variant-numeric: tabular-nums; }
.badge.difesa, .badge.consacrata { color: var(--terra); } .badge.fuoco { color: var(--fuoco); } .badge.gelo { color: var(--gelo); } .badge.acqua { color: var(--acqua); }
.arr { position: absolute; z-index: 2; width: 13px; height: 13px; border-radius: 7px; background: var(--bg); border: 1px solid var(--line); font-size: 10px; font-weight: 800; line-height: 11px; text-align: center; pointer-events: none; box-sizing: border-box; }
.arr.A { color: var(--blu); } .arr.B { color: var(--rosso); } .arr.pend { color: var(--oro); }
.arr.dx { left: -6px; top: calc(50% - 6.5px); }
.arr.giu { top: -6px; left: -6px; }
.arr.su { bottom: -6px; left: -6px; }
.board.placing { touch-action: none; }
.board.placing .tile.pend { cursor: grab; }
.board.dragging .tile.pend { cursor: grabbing; transform: scale(1.08); box-shadow: 0 6px 14px rgba(0,0,0,.55); z-index: 4; }
.cell.badcell { box-shadow: 0 0 0 2px var(--rosso) inset; }
.cell.launch { outline: 2px solid var(--fuoco); outline-offset: -1px; animation: pulse 1s ease-in-out infinite alternate; z-index: 1; }
.cell .dmg { position: absolute; top: -9px; right: -6px; z-index: 3; background: var(--fuoco); color: #221004; font-size: 11px; font-weight: 800; border-radius: 8px; padding: 0 5px; }
.cell .dmg.zero { background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
.cell.trail {
  background-image: radial-gradient(circle, rgba(255, 152, 56, .52) 0%, rgba(255, 72, 24, .22) 68%, transparent 100%);
  box-shadow: 0 0 0 2px var(--fuoco) inset, 0 0 14px rgba(255, 110, 30, .85); z-index: 2;
}
.cell.trail .pw, .cell.fire-head .pw, .cell.origin .pw {
  position: absolute; top: -8px; left: -6px; z-index: 5; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px;
  background: var(--fuoco); color: #221004; border: 1px solid #ffe07d; font-size: 11px; font-weight: 800; line-height: 16px; text-align: center;
}
.cell.hitdef { box-shadow: 0 0 0 2px var(--terra) inset, 0 0 16px var(--terra), 0 0 22px var(--fuoco); z-index: 3; }
.cell.origin { box-shadow: 0 0 0 2px #ffd36b inset, 0 0 16px rgba(255, 120, 30, .9); animation: fireOrigin .7s ease-in-out infinite alternate; z-index: 2; }
.cell.burn-word { animation: fireFlicker .55s ease-in-out infinite alternate; z-index: 2; }
.tile.ghost-burn {
  background: linear-gradient(180deg, #fff2c8 0%, #ffb45c 100%); color: #3a1204;
  outline: 2px solid var(--fuoco); outline-offset: -2px;
  box-shadow: 0 0 12px rgba(255, 110, 25, .85), inset 0 -3px 0 #d9381e;
}
.tile.ghost-shield { background: #233322; color: #c7f0b8; outline: 2px dashed var(--terra); outline-offset: -2px; }
.tile.ghost-shield.shattered { opacity: .45; outline-color: var(--fuoco); }
.cell.fire-head { z-index: 4; box-shadow: 0 0 0 2px #ffe07d inset, 0 0 20px 3px rgba(255, 110, 25, .95); }
.flame { position: absolute; inset: -6px; pointer-events: none; z-index: 4; }
.flame::before {
  content: ""; position: absolute; inset: 0; border-radius: 50% 50% 42% 42%;
  background: radial-gradient(circle at 50% 58%, #fff9c4 0%, #ffb830 34%, #ff5719 72%, transparent 94%);
  filter: drop-shadow(0 0 10px rgba(255, 100, 25, .9));
  animation: flameDance .28s ease-in-out infinite alternate;
}
.dir-up .flame::before { transform: rotate(0deg); }
.dir-down .flame::before { transform: rotate(180deg); }
.flame::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; border-radius: 50%;
  background: #ffe082; transform: translate(-50%, -50%);
  box-shadow: -11px -7px 0 0 #ff9436, 12px -4px 0 0 #ffd54f, -8px 10px 0 0 #ff6a2b, 9px 9px 0 0 #ffab40;
  animation: emberFloat .55s ease-out infinite;
}
.boardwrap.impact-top::after, .boardwrap.impact-bottom::after {
  content: ""; position: absolute; left: 4px; right: 4px; height: 34px; pointer-events: none; z-index: 5;
  animation: impactWave 1.1s ease-out both;
}
.boardwrap.impact-top::after { top: 4px; border-radius: 10px 10px 0 0; background: linear-gradient(180deg, rgba(255, 92, 36, .65), transparent); }
.boardwrap.impact-bottom::after { bottom: 4px; border-radius: 0 0 10px 10px; background: linear-gradient(0deg, rgba(255, 92, 36, .65), transparent); }
.atk-banner {
  position: absolute; left: 10px; right: 10px; z-index: 8; cursor: pointer; text-align: center;
  background: rgba(26, 14, 18, .93); backdrop-filter: blur(6px); border: 1.5px solid var(--fuoco); border-radius: 12px;
  padding: 8px 12px; box-shadow: 0 8px 26px rgba(0, 0, 0, .65), 0 0 18px rgba(255, 108, 30, .35);
}
.atk-banner.at-top { top: 10px; }
.atk-banner.at-bottom { bottom: 10px; }
.atk-banner.hit { border-color: var(--rosso); box-shadow: 0 8px 26px rgba(0, 0, 0, .65), 0 0 22px rgba(255, 70, 50, .55); }
.atk-banner strong { display: block; font-size: 14.5px; color: #ffcf7d; line-height: 1.25; }
.atk-banner span { display: block; font-size: 13px; color: var(--text); margin-top: 2px; }
.atk-banner small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
@keyframes pulse { from { box-shadow: 0 0 0 0 var(--fuoco); } to { box-shadow: 0 0 10px 1px var(--fuoco); } }
@keyframes fireFlicker { from { box-shadow: 0 0 8px 1px rgba(255, 120, 30, .65); } to { box-shadow: 0 0 18px 4px rgba(255, 72, 24, .95); } }
@keyframes fireOrigin { from { box-shadow: 0 0 0 2px #ffd36b inset, 0 0 12px rgba(255, 120, 30, .75); } to { box-shadow: 0 0 0 2px #fff2b2 inset, 0 0 22px rgba(255, 90, 24, 1); } }
@keyframes flameDance { from { scale: .92 1.04; opacity: .9; } to { scale: 1.08 .95; opacity: 1; } }
@keyframes emberFloat { 0% { opacity: 1; scale: .8; } 100% { opacity: 0; scale: 1.35; } }
@keyframes impactWave { 0% { opacity: 0; } 22% { opacity: 1; } 100% { opacity: 0; } }
@keyframes hitShake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-4px); } 45% { transform: translateX(4px); } 70% { transform: translateX(-2px); } }
@keyframes dmgPop { 0% { opacity: 0; transform: translateY(-20%) scale(.7); } 100% { opacity: 1; transform: translateY(-50%) scale(1); } }
@keyframes guidePulse { from { box-shadow: 0 0 0 0 rgba(255, 138, 61, .2); } to { box-shadow: 0 0 14px 1px rgba(255, 138, 61, .38); } }
.legend { display: flex; justify-content: center; gap: 4px 12px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; background: var(--c); border: 1px solid var(--b, var(--line)); box-sizing: border-box; }

.preview { min-height: 20px; text-align: center; font-weight: 700; font-size: 15px; }
.preview.err { color: var(--rosso); font-weight: 500; }
.preview .tipo { color: var(--muted); font-weight: 500; }
.hand {
  display: flex; gap: 6px; flex-wrap: nowrap; justify-content: center; align-items: center;
  min-height: 58px; padding: 9px 8px 7px;
  background: linear-gradient(180deg, var(--panel) 0%, #151220 100%);
  border: 1px solid var(--line); border-bottom: 3px solid #0b0911; border-radius: 14px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.38), 0 4px 12px rgba(0,0,0,.22);
}
.htile {
  flex: 0 1 44px; min-width: 0; width: clamp(36px, calc((100% - 36px) / 7), 44px); height: clamp(42px, 12vw, 48px);
  border-radius: 8px; background: var(--tile); color: var(--tile-ink); border: none; position: relative;
  font: 800 clamp(20px, 5.6vw, 24px)/1 var(--font-body); cursor: pointer;
  box-shadow: 0 2px 5px rgba(0,0,0,.32), inset 0 -3px 0 rgba(0,0,0,.22); transition: transform .12s;
}
.htile .v { position: absolute; right: 3px; bottom: 2px; font-size: 10px; font-weight: 700; }
.htile.rune { box-shadow: 0 2px 5px rgba(0,0,0,.32), inset 0 -3px 0 var(--oro); }
.htile.sel { transform: translateY(-6px); outline: 3px solid var(--oro); }
.htile.alch { outline: 3px solid var(--acqua); transform: translateY(-6px); }
.htile.pesa { outline: 2px dashed var(--oro); }
.cell.bordo { box-shadow: inset 0 0 0 2px var(--terra); }
.btn.meta { min-width: 2.4em; }
.btn.meta.on { outline: 2px solid var(--acqua); }
.htile.ghost { background: var(--panel2); color: var(--muted); box-shadow: none; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; }
.btn.ready-atk { border-color: var(--fuoco); color: #ffbe73; background: #2e1d15; animation: guidePulse 1.2s ease-in-out infinite alternate; }
.guide { display: flex; align-items: flex-start; gap: 9px; padding: 8px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 13.5px; line-height: 1.35; }
.guide .g-ico { font-size: 17px; line-height: 1.15; flex-shrink: 0; margin-top: 1px; }
.guide .g-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.guide .g-title { font-size: 14.5px; font-weight: 800; color: var(--oro); }
.guide .g-text { color: var(--muted); }
.guide.hot { background: linear-gradient(135deg, rgba(255, 138, 61, .17), rgba(255, 98, 106, .11)); border-color: color-mix(in srgb, var(--fuoco) 72%, transparent); animation: guidePulse 1.6s ease-in-out infinite alternate; }
.guide.hot .g-title { color: #ffbe73; }
.guide.hot .g-text { color: var(--text); }
.guide.gold { border-color: color-mix(in srgb, var(--oro) 50%, transparent); background: rgba(240, 192, 90, .07); }
.guide.def { border-color: color-mix(in srgb, var(--terra) 55%, transparent); background: rgba(134, 201, 107, .08); }
.guide.def .g-title { color: var(--terra); }
.guide.warn { border-color: color-mix(in srgb, var(--rosso) 55%, transparent); background: rgba(255, 98, 106, .09); }
.guide.warn .g-title { color: #ff8c92; }
.guide.info .g-title { color: var(--text); }
.log { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); max-height: 220px; overflow: auto; }
.log div:first-child { color: var(--text); }
details summary { cursor: pointer; font-weight: 700; color: var(--muted); }
.toast {
  position: fixed; left: 50%; top: calc(50px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30;
  background: rgba(37, 33, 54, .95); backdrop-filter: blur(6px); border: 1px solid var(--oro); color: var(--text);
  padding: 8px 14px; border-radius: 11px; font-size: 14.5px; line-height: 1.3; font-weight: 700;
  max-width: min(480px, calc(100vw - 32px)); box-shadow: 0 8px 24px rgba(0,0,0,.55); cursor: pointer;
}
.toast.err { border-color: var(--rosso); }
.sheet {
  position: fixed; inset: 0; z-index: 25; background: rgba(9, 7, 15, .72); backdrop-filter: blur(3px);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet .in {
  width: 100%; max-width: 540px; max-height: 80dvh; overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-bottom: none; border-radius: 18px 18px 0 0;
  box-shadow: 0 -12px 36px rgba(0,0,0,.6);
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
.sheet h3 { margin: 0; font: 700 20px var(--font-display); color: var(--oro); }

  "Le parole che puoi comporre con le tue lettere. Aggiungi in «Lettere in più» quelle sul campo che vuoi incrociare: le parole che le usano lo indicano in oro (+R).": "The words you can make with your letters. Add under “Extra letters” the ones on the board you want to cross: words that use them show it in gold (+R).",

  "Dizionario inglese": "English dictionary",
  "Ognuno vede il proprio Sanctum in basso. Le parole verticali si leggono dall'alto in basso dal lato di chi le ha scritte.": "Each player sees their own Sanctum at the bottom. Vertical words read top to bottom from the side of whoever wrote them.",
  "A turno scrivi una parola italiana sulla griglia, come a Scarabeo: tutte le parole che si formano devono essere valide. Al primo turno scrivi solo nel tuo Sanctum.": "Take turns writing an Italian word on the grid, crossword-style: every word formed must be valid. On your first turn you write only in your Sanctum.",
  "A turno scrivi una parola inglese sulla griglia, come a Scarabeo: tutte le parole che si formano devono essere valide. Al primo turno scrivi solo nel tuo Sanctum.": "Take turns writing an English word on the grid, crossword-style: every word formed must be valid. On your first turn you write only in your Sanctum.",
  "Collegamento Magico: una catena di parole dal tuo Sanctum fino a una parola tutta nella Terra di Mezzo che tocca il Passo Arcano (la riga dorata). Con il Collegamento attivo puoi entrare nel Sanctum nemico, agganciandoti a una sua parola.": "Magic Link: a chain of words from your Sanctum to a word lying entirely in the Midlands that touches the Arcane Pass (the golden row). With the Link active you can enter the enemy Sanctum by hooking onto one of its words.",
  "Attacco: qualsiasi parola che ha una lettera nel Sanctum nemico può essere lanciata (tocca «Attacca»). La potenza è il punteggio della parola; l'incantesimo corre verso il bordo del Sanctum nemico e perde 1 per casella e 1 in più per ogni lettera. Dopo il lancio la parola si consuma: sparisce, tranne le lettere che reggono altre parole.": "Attack: any word with a letter in the enemy Sanctum can be launched (tap “Attack”). Its power is the word's score; the spell runs to the edge of the enemy Sanctum and loses 1 per square and 1 more for each letter. After the launch the word is consumed: it disappears, except for letters that hold up other words.",
  "Difesa: consacra una parola scritta tutta nel tuo Sanctum (tocca «Consacra»). La sua resistenza è {r} il punteggio, massimo {m} attive, e perde 1 a ogni tuo turno.": "Defence: consecrate a word written entirely in your Sanctum (tap “Consecrate”). Its resistance is {r} its score, up to {m} active, and it loses 1 on each of your turns.",
  "{n} volte": "{n} times",
  "metà del": "half",
  "Scudo: una difesa consacrata protegge tutta la sua riga (le righe a strisce). Un incantesimo lanciato su quella riga, o che la attraversa per uscire, deve prima superarla: se è più debole viene assorbito, se è più forte la disintegra e prosegue con la potenza che resta. Gli scudi si sommano.": "Shield: a consecrated defence protects its whole row (the striped rows). A spell launched on that row, or crossing it on the way out, must first get past it: if weaker it is absorbed, if stronger it shatters the shield and carries on with the power left. Shields add up.",
  "Le difese intercettano gli incantesimi nella loro colonna e in quelle accanto.": "Defences intercept spells in their column and the ones next to it.",
  "Grande Falò: allunga o incrocia una parola al centro o nel Sanctum nemico e bruciala tutta, qualunque sia la sua resistenza; una volta ogni {n} turni. È il modo per togliere uno Scudo troppo forte. Bruciare parole al centro scatena una Tempesta sulle parole vicine.": "Great Bonfire: extend or cross a word in the centre or in the enemy Sanctum and burn it all, whatever its resistance; once every {n} turns. It is the way to remove a Shield that is too strong. Burning words in the centre unleashes a Storm on the nearby words.",
  "Le parole non lanciate fanno da ponte o da ostacolo e perdono 1 di Stabilità a ogni tuo turno. Alchimia: invece di scrivere scarti le lettere che vuoi e peschi fino a tornare a 7.": "Words that are not launched act as bridges or obstacles and lose 1 Stability on each of your turns. Alchemy: instead of writing, discard any letters you like and draw back up to 7.",
  "Vince chi porta l'avversario a 0 Punti Vita (in questa partita si parte da {n}).": "The winner is whoever brings the opponent to 0 Health Points (this game starts at {n}).",
  "Ognuno vede il proprio Sanctum in basso, come seduti ai lati opposti di un tavolo. Le parole verticali si leggono dall'alto in basso dal lato di chi le ha scritte: quelle dell'avversario le vedi capovolte.": "Each player sees their own Sanctum at the bottom, as if sitting on opposite sides of a table. Vertical words read top to bottom from the side of whoever wrote them: you see your opponent's upside down.",
  "Il Sanctum del Mago Blu è in alto, quello del Mago Rosso in basso. Le parole si leggono da sinistra a destra e dall'alto in basso.": "The Blue Wizard's Sanctum is at the top, the Red Wizard's at the bottom. Words read left to right and top to bottom.",
  "Le parole di Fuoco, Gelo e Acqua sono attacchi: scegli una loro lettera in un Sanctum e l'incantesimo corre dritto lungo la colonna verso il mago avversario. Perde 1 di potenza per casella e 1 in più per ogni lettera che attraversa.": "Fire, Frost and Water words are attacks: pick one of their letters in a Sanctum and the spell runs straight along the column towards the enemy wizard. It loses 1 power per square and 1 more for each letter it crosses.",
  "Le parole di Terra sono difese permanenti: intercettano gli incantesimi nella loro colonna e in quelle accanto. Puoi anche consacrare come difesa una parola neutra del tuo Sanctum (metà resistenza, si consuma, massimo {m} attive).": "Earth words are permanent defences: they intercept spells in their column and the ones next to it. You can also consecrate a neutral word in your Sanctum as a defence (half resistance, it wears out, up to {m} active).",
  "Per invadere il Sanctum nemico serve il Collegamento Magico: una catena di parole dal tuo Sanctum fino a una parola tutta nella Terra di Mezzo che tocca il Passo Arcano (la riga dorata).": "To invade the enemy Sanctum you need the Magic Link: a chain of words from your Sanctum to a word lying entirely in the Midlands that touches the Arcane Pass (the golden row).",
  "Grande Falò: allunga o incrocia una parola al centro o nel Sanctum nemico e bruciala, una volta ogni {n} turni. Distruggere parole al centro scatena una Tempesta sulle parole vicine.": "Great Bonfire: extend or cross a word in the centre or in the enemy Sanctum and burn it, once every {n} turns. Destroying words in the centre unleashes a Storm on the nearby words.",
  "Le parole d'attacco e neutre perdono 1 di Stabilità a ogni tuo turno e poi si spengono. Alchimia: invece di scrivere scarti le lettere che vuoi e peschi fino a tornare a 7.": "Attack and neutral words lose 1 Stability on each of your turns and then fade. Alchemy: instead of writing, discard any letters you like and draw back up to 7.",
  "Toccando una lettera sulla griglia vedi a quali parole appartiene, il loro tipo e quanto durano ancora.": "Tap a letter on the grid to see which words it belongs to, their type and how long they will last.",

  "Suggerimento: trasforma {a} in {b}. Tocca «Trasforma {a} in {b}», oppure scegli un'altra lettera.": "Hint: transform {a} into {b}. Tap “Transform {a} into {b}”, or pick another letter.",
  "Si trasformano solo le lettere pesanti (da {n} punti in su).": "Only heavy letters ({n} points or more) can be transformed.",
  "Nessuna lettera pesante nel Grimorio (da {n} punti in su).": "No heavy letter in your Grimoire ({n} points or more).",
  "Al posto di scrivere una parola, trasformi una lettera pesante (da {n} punti in su) in una che vale al massimo la metà. Tocca nel Grimorio la lettera pesante, quelle tratteggiate.": "Instead of writing a word, you turn a heavy letter ({n} points or more) into one worth at most half. Tap the heavy letter in your Grimoire (the dashed ones).",
  "Scegli qui sotto in cosa trasformare {l} (al massimo {m} punti) e tocca «Trasforma». La lettera resta quella nuova e il turno passa all'avversario.": "Choose below what to turn {l} into (at most {m} points) and tap “Transform”. The letter stays the new one and your turn ends.",
  "È sulla riga del bordo: tocca «Consacra» per trasformarla in Scudo, che protegge tutto il tuo Sanctum, oppure «Conferma» come ponte.": "It is on the edge row: tap “Consecrate” to turn it into a Shield that protects your whole Sanctum, or “Confirm” to use it as a bridge.",
  "Può invadere il tuo Sanctum! Al tuo turno scrivi una parola sulla riga del bordo, quella più lontana dal centro, e premi «Consacra» per creare uno Scudo.": "They can invade your Sanctum! On your turn write a word on the edge row, the one farthest from the centre, and press “Consecrate” to create a Shield.",
  "Ha il Ponte attivo: scrivi una parola sulla riga del bordo del tuo Sanctum ({d}), quella più lontana dal centro, e premi «Consacra» per creare uno Scudo.": "Their Bridge is active: write a word on the edge row of your Sanctum ({d}), the one farthest from the centre, and press “Consecrate” to create a Shield.",
  "Difesa: consacra una parola scritta tutta sulla riga del bordo del tuo Sanctum, la più lontana dal centro (tocca «Consacra»). La sua resistenza è pari al suo punteggio, massimo {m} attive, e perde 1 a ogni tuo turno.": "Defence: consecrate a word written entirely on the edge row of your Sanctum, the one farthest from the centre (tap “Consecrate”). Its resistance equals its score, at most {m} active, and it loses 1 on each of your turns.",
  "Trasformazione: invece di scrivere trasformi una lettera pesante (da {n} punti in su) in una che vale al massimo la metà, per esempio Q (10) in una lettera da 5 punti o meno. La lettera resta quella nuova.": "Transformation: instead of writing, you turn a heavy letter ({n} points or more) into one worth at most half, for example Q (10) into a letter worth 5 points or less. The letter stays the new one.",

  "Una parola vale se è in almeno uno dei dizionari scelti. Con più dizionari la Sacca è mista: 26 lettere.": "A word counts if it is in at least one of the chosen dictionaries. With more than one dictionary the Bag is mixed: 26 letters.",

  "A turno scrivi una parola in {l} sulla griglia, come a Scarabeo: tutte le parole che si formano devono essere valide. Al primo turno scrivi solo nel tuo Sanctum.": "Take turns writing a word in {l} on the grid, crossword-style: every word formed must be valid. On your first turn you write only in your Sanctum.",

  "Nel frattempo": "Meanwhile",
  "Tocca una lettera già sul campo per vedere a quali parole appartiene e quanta Stabilità le resta.": "Tap any letter on the board to see which words it belongs to and how much Stability it has left.",
  "Scegli da dove lanciare!": "Choose where to launch from!",
  "Tocca una delle lettere accese in arancio: il numero indica quanti PV toglierà l'incantesimo (perde 1 per casella e 1 per lettera attraversata).": "Tap one of the glowing orange letters: the number shows how much HP the spell will deal (it loses 1 per square and 1 per letter crossed).",
  "Al posto di scrivere una parola, scarti le lettere che non ti servono: toccale nel Grimorio (o premi «Tutte») e poi «Cambia». Finiscono nel Focolare e peschi dalla Sacca fino a tornare a {n} lettere, quindi se ne hai di più ti alleggerisci. Il turno passa all'avversario: conviene quando hai lettere pesanti, nessuna vocale o nessuna parola utile.": "Instead of writing a word, you discard the letters you don't need: tap them in your Grimoire (or press “All”) and then “Change”. They go to the Hearth and you draw from the Bag until you are back to {n} letters, so if you hold more you get lighter. Your turn ends: it is worth it when you have heavy letters, no vowels or no useful word.",
  "Ora puoi attaccare!": "Now you can attack!",
  "Questa parola tocca il Sanctum nemico: premi «Attacca» qui sopra e poi «Conferma» per lanciare l'incantesimo (potenza {n}).": "This word reaches the enemy Sanctum: tap “Attack” above and then “Confirm” to launch the spell (power {n}).",

// ---------- dizionario ----------
// un dizionario per lingua, caricato solo quando serve; dictState / DICT_TEXT / DICT_OFFS sono quelli della partita in uso
// (con più dizionari, DICT_TEXT è il loro testo unito)
const DIZ = { it: { file: "parole.txt", parole: 750000, nome: "italiano" }, en: { file: "words-en.txt", parole: 140000, nome: "inglese" } };
const DIZ_UNITI = {};
let dictState = "carico", dictLang = "it", dictLangs = ["it"];
let DICT_TEXT = "", DICT_OFFS = null;
function makeDict(text) {
  const offs = [0];
  for (let i = 0; i < text.length; i++) if (text.charCodeAt(i) === 10) offs.push(i + 1);
  const o = Uint32Array.from(offs), n = o.length;
  const line = i => text.slice(o[i], i + 1 < n ? o[i + 1] - 1 : text.length);
  return { text, offs: o, has(w) { let lo = 0, hi = n - 1; while (lo <= hi) { const m = (lo + hi) >> 1, x = line(m); if (x === w) return true; if (x < w) lo = m + 1; else hi = m - 1; } return false; } };
}
function usaDiz(ls) {
  ls = G.dizionariDi({ dizionari: ls });
  dictLangs = ls; dictLang = ls.join("+");
  ls.forEach(l => { if (!DIZ[l].stato) loadDict(l); });
  const st = ls.map(l => DIZ[l].stato);
  dictState = st.includes("errore") ? "errore" : st.every(x => x === "pronto") ? "pronto" : "carico";
  DICT_TEXT = ""; DICT_OFFS = null;
  if (dictState !== "pronto") return;
  if (ls.length === 1) { DICT_TEXT = DIZ[ls[0]].text; DICT_OFFS = DIZ[ls[0]].offs; return; }
  if (!DIZ_UNITI[dictLang]) { const dz = makeDict(G.unisciTesti(ls.map(l => DIZ[l].text))); DIZ_UNITI[dictLang] = { text: dz.text, offs: dz.offs }; }
  DICT_TEXT = DIZ_UNITI[dictLang].text; DICT_OFFS = DIZ_UNITI[dictLang].offs;
}
// nomi dei dizionari di una cfg, nella lingua dell'interfaccia: "italiano o inglese"
function nomiDiz(c, sep) { return G.dizionariDi(c || {}).map(l => tr(DIZ[l].nome)).join(sep || tr(" o ")); }
async function loadDict(l) {
  const d = DIZ[l]; if (d.stato) return;
  d.stato = "carico";
  try {
    const res = await fetch(d.file);
    if (!res.ok) throw new Error("http " + res.status);
    const buf = new Uint8Array(await res.arrayBuffer());
    let text;
    if (buf[0] === 0x1f && buf[1] === 0x8b) text = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    else text = new TextDecoder().decode(buf);
    const dz = makeDict(text.replace(/\r/g, "").trim());
    d.text = dz.text; d.offs = dz.offs;
    G.setDict(dz, l);
    d.stato = "pronto";
  } catch (e) { d.stato = "errore"; }
  if (dictLangs.includes(l)) usaDiz(dictLangs);
  render();
}
// dizionari scelti per le nuove partite (salvati sul dispositivo; prima era una sola lingua)
function dizScelti() {
  let l = store.get("grimorio-lingua-parole", [LANG]);
  if (!Array.isArray(l)) l = [l];
  return G.dizionariDi({ dizionari: l });
}

let DB = null, USER = null, MYID = null, CANWRITE = null, conn = "collego", LOCAL = false;
let games = {}, localGames = {};

let unsubGame = null;
let pendingOpen = null;

function myName() { return store.get("grimorio-nome", "") || ""; }
function localToken() {
  let t = store.get("grimorio-token", null);
  if (!t) { t = "t" + Math.random().toString(36).slice(2) + Date.now().toString(36); store.set("grimorio-token", t); }
  return t;
}
async function init() {
  usaDiz(dizScelti()); render();
  const c = window.claude;
  if (c && c.use) {
    try { [DB, USER] = await Promise.all([c.use("db"), c.use("user")]); } catch (e) { DB = null; }
  }
  if (USER) { try { MYID = await USER.id(); } catch (e) {} try { CANWRITE = await USER.can("data.write"); } catch (e) {} }
  if (!MYID) MYID = localToken();
  if (DB) subscribeLobby(); else { LOCAL = true; conn = "locale"; localGames = store.get("grimorio-locali", {}); games = localGames; }
  const hash = location.hash.slice(1);
  if (hash) pendingOpen = hash;
  render(); tryPendingOpen();
}
function subscribeLobby() {
  const timer = setTimeout(() => { if (conn === "collego") { conn = "lento"; render(); } }, 10000);
  DB.collection("partite").onSnapshot(snap => {
    clearTimeout(timer);
    const g = {}; snap.docs.forEach(d => { g[d.id] = d.data(); });
    games = g; if (!snap.metadata.fromCache) conn = "ok"; else if (conn === "collego") conn = "ok";
    render(); tryPendingOpen();
  }, err => { clearTimeout(timer); conn = "errore"; render(); });
}
function tryPendingOpen() { if (pendingOpen && games[pendingOpen]) { const id = pendingOpen; pendingOpen = null; openGame(id); } }
function saveLocal() { store.set("grimorio-locali", localGames); }
function errText(e) {
  if (e && e.code === "invalid_argument") return tr("Non hai il permesso di salvare: chiedi al proprietario di invitarti come Editor.");
  if (e && e.code === "quota_exceeded") return tr("Lo spazio delle partite è pieno: elimina qualche partita finita.");
  return tr("Salvataggio non riuscito. Riprova tra poco.");
}
async function writeGame(id, data) {
  data = JSON.parse(JSON.stringify(data)); // solo JSON puro: niente valori undefined
  if (LOCAL) { localGames[id] = data; saveLocal(); games = localGames; if (cur && cur.id === id) onGameData(data); render(); return; }
  await DB.doc("partite/" + id).set(data);
}

  const s = S(); if (!s) return null;
  const a = s.seats.A && s.seats.A.tok === MYID, b = s.seats.B && s.seats.B.tok === MYID;
  if (a && b) return s.turn;

  const x = s.seats[p];

async function createGame(hp, both, vs, regole, dizionari) {
  const nome = myName();
  dizionari = G.dizionariDi({ dizionari });
  if (dizionari.join() !== "it") regole = "s2";
  G.applyCfg(Object.assign({}, (REGOLE[regole] || REGOLE.v5f).cfg, { hp, dizionari }));
  const s = G.newGame();
  s.seats.A = { tok: MYID, nome: nome || NOMI.A };
  if (vs && vs !== "persona") s.seats.B = { tok: "cpu", nome: "Automa" + (vs === "facile" ? " (facile)" : ""), cpu: true, livello: vs };
  else if (both) s.seats.B = { tok: MYID, nome: (nome ? nome + " (rosso)" : NOMI.B) };
  const id = "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const data = { s, created: Date.now(), updated: Date.now() };
  try { await writeGame(id, data); games[id] = data; openGame(id); }
  catch (e) { toast(errText(e), true); }
}

// ---------- partita ----------
function openGame(id) {
  if (unsubGame) { unsubGame(); unsubGame = null; }
  ui = freshUi(); stopAnim();
  cur = { id, data: games[id] || null };
  try { history.replaceState(null, "", "#" + id); } catch (e) { location.hash = id; }
  if (cur.data) onGameData(cur.data, true);
  if (!LOCAL) unsubGame = DB.doc("partite/" + id).onSnapshot(snap => {
    if (!snap.exists) { if (!snap.metadata.fromCache) { toast(tr("La partita non esiste più.")); leaveGame(); } return; }
    onGameData(snap.data());
  }, () => toast(tr("Non riesco più a seguire la partita."), true));
  render(); window.scrollTo(0, 0);
}
function leaveGame() {
  if (unsubGame) { unsubGame(); unsubGame = null; }
  cur = null; ui = freshUi(); stopAnim();
  usaDiz(dizScelti());
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
  render();
}
function onGameData(data, first) {
  const prev = cur && cur.data && cur.data.s;
  cur.data = JSON.parse(JSON.stringify(data));
  const s = cur.data.s;
  G.applyCfg(s.cfg || BASE);

let aiWorker = null, aiBusy = false;

    actions.push(h("button", { class: "btn", onclick: () => { ui.alch = null; render(); }, text: tr("Annulla") }));
    actions.push(h("button", { class: "btn small", onclick: () => { ui.alch = hand.map((_, i) => i); render(); }, text: tr("Tutte") }));
    actions.push(h("button", { class: "btn primary", disabled: !ui.alch.length, onclick: doAlchimia, text: tr("Cambia {n} lettere", { n: ui.alch.length }) }));
  } else if (turn && ui.place && !ui.pending.length) {
    actions.push(h("button", { class: "btn", onclick: cancelPlace, text: tr("Annulla") }));
    actions.push(h("button", { class: "btn", onclick: rotatePlace, text: tr("↻ Gira ({d})", { d: tr(ui.place.dir === "h" ? tr("ora orizzontale") : tr("ora verticale")) }) }));
  } else if (turn && ui.pending.length) {
    const pv = previewLine();
    actions.push(h("button", { class: "btn", onclick: () => { ui.pending = []; ui.mode = null; ui.place = null; hideToast(); render(); }, text: tr("Ritira") }));
    if (ui.place) actions.push(h("button", { class: "btn", "aria-label": tr("Gira la parola"), onclick: rotatePlace, text: tr("↻ Gira") }));
    if (s.cfg && s.cfg.attaccoLibero) actions.push(h("button", { class: "btn" + (ui.mode === "attacca" ? " on" : readyAtk ? " ready-atk" : ""), "aria-pressed": ui.mode === "attacca", onclick: () => { ui.mode = ui.mode === "attacca" ? null : "attacca"; render(); }, text: tr("Attacca") }));
    actions.push(h("button", { class: "btn" + (ui.mode === "falo" ? " on" : ""), "aria-pressed": ui.mode === "falo", onclick: () => { ui.mode = ui.mode === "falo" ? null : "falo"; render(); }, text: tr("Falò") }));
    if (s.cfg && s.cfg.consacrazione) actions.push(h("button", { class: "btn" + (ui.mode === "consacra" ? " on cons" : ""), "aria-pressed": ui.mode === "consacra", onclick: () => { ui.mode = ui.mode === "consacra" ? null : "consacra"; render(); }, text: tr("Consacra") }));
    actions.push(h("button", { class: "btn primary", disabled: !pv || pv.err, onclick: onConfirm, text: tr("Conferma") }));
  } else if (turn) {
    actions.push(h("button", { class: "btn small", onclick: () => { const o = hand.map((_, i) => i); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } ui.order = o; ui.sel = null; render(); }, text: tr("Mescola") }));
    actions.push(h("button", { class: "btn small", onclick: () => { ui.alch = []; ui.sel = null; render(); }, text: tr("Alchimia") }));
    if (s.cfg && s.cfg.trasformazione) {
      const pes = hand.map((l, i) => pesante(l) ? i : -1).filter(i => i >= 0);
      actions.push(h("button", { class: "btn small", disabled: !pes.length, title: pes.length ? "" : tr("Nessuna lettera pesante nel Grimorio (da {n} punti in su).", { n: trasfMin() }), onclick: () => { ui.trasf = { i: pes.length === 1 ? pes[0] : null, a: null }; ui.sel = null; render(); }, text: tr("Trasforma") }));
    }
    const costo = (s.cfg && s.cfg.costoSuggerimento) || 3;
    actions.push(ui.hintConfirm
      ? h("button", { class: "btn small danger", onclick: () => { ui.hintConfirm = false; askHint(); }, text: tr("Sì, suggerisci (−{n} PV)", { n: costo }) })
      : h("button", { class: "btn small", disabled: hintBusy || s.hp[mySeat()] <= costo, title: tr("Il computer ti propone la mossa migliore: costa {n} PV", { n: costo }), onclick: () => { ui.hintConfirm = true; render(); clearTimeout(confirmTimer); confirmTimer = setTimeout(() => { ui.hintConfirm = false; render(); }, 4000); }, text: tr(hintBusy ? tr("Ci penso…") : tr("Suggerisci")) }));
    actions.push(ui.passConfirm
      ? h("button", { class: "btn small danger", onclick: doPass, text: tr("Sì, passa il turno") })
      : h("button", { class: "btn small", onclick: () => { ui.passConfirm = true; render(); clearTimeout(confirmTimer); confirmTimer = setTimeout(() => { ui.passConfirm = false; render(); }, 4000); }, text: tr("Passa") }));
  }
  const pv = previewLine();
  const guide = guideHint(s, me, curVal);
  const bwCls = "boardwrap" + (anim && anim.kind === "attacco" && anim.phase === "impact" && anim.damage > 0 ? (anim.target === top ? " impact-top" : " impact-bottom") : "");
  const seatBtns = [];
  if (!me && !s.winner) for (const p of ["A", "B"]) {
    if (!s.seats[p]) seatBtns.push(h("button", { class: "btn primary", disabled: CANWRITE === false, onclick: () => sitDown(p), text: tr("Siediti come {n}", { n: tr(NOMI[p]) }) }));
  }
  if (!me && s.seats.A && s.seats.B && !s.winner) {
    seatBtns.push(ui.claimConfirm
      ? h("div", { class: "row" }, ["A", "B"].map(p => h("button", { class: "btn small", onclick: () => sitDown(p), text: tr("Sono {n}", { n: seatName(s, p) }) })))
      : h("button", { class: "btn link", onclick: () => { ui.claimConfirm = true; render(); }, text: tr("Stai già giocando questa partita da un altro dispositivo?") }));
  }

  fill(Gm, 
    h("div", { class: "topbar" },
      h("button", { class: "btn small", onclick: leaveGame, text: tr("← Partite") }),
      h("span", { class: "title", text: "Grimorio" }),
      soundBtn(),
      h("button", { class: "btn small", onclick: showRules, text: tr("Regole") })),
    pbar(s, top),
    h("div", { class: bwCls }, boardEl(s), atkBannerEl(s)),
    h("div", { class: "legend" },
      h("span", { style: "--c:var(--z" + top + ");--b:var(--" + (top === "A" ? "blu" : "rosso") + ")", text: tr("▲ Sanctum {c}", { c: tr(top === "A" ? tr("Blu") : tr("Rosso")) }) + (me === top && !both ? tr(" (tuo)") : "") }),
      h("span", { style: "--c:var(--zS);--b:var(--oro)", text: tr("Passo Arcano · → ↓ ↑ verso di lettura") }),
      h("span", { style: "--c:var(--z" + G.enemy(top) + ");--b:var(--" + (top === "A" ? "rosso" : "blu") + ")", text: tr("▼ Sanctum {c}", { c: tr(top === "A" ? tr("Rosso") : tr("Blu")) }) + (me === G.enemy(top) && !both ? tr(" (tuo)") : "") })),
    pbar(s, G.enemy(top)),
    h("p", { class: "status" }, status, sub ? h("small", { text: sub }) : null),
    s.winner ? h("p", { class: "winner", text: "✦ " + seatName(s, s.winner) + " ✦" }) : null,
    seatBtns.length ? h("div", { class: "actions" }, seatBtns) : null,
    pv ? h("p", { class: "preview" + (pv.err ? " err" : "") }, pv.text, pv.tipo ? h("span", { class: "tipo", text: " · " + pv.tipo }) : null) : (me && myTurn() ? h("p", { class: "preview" }, h("span", { class: "tipo", text: tr(ui.sel !== null ? tr("Ora tocca una casella del campo") : tr("Tocca una lettera, poi una casella")) })) : null),
    handEl,
    actions.length ? h("div", { class: "actions" }, actions) : null,
    guide ? h("div", { class: "guide " + guide.tone, role: "note" },
      h("span", { class: "g-ico", "aria-hidden": "true", text: guide.ico }),
      h("div", { class: "g-body" }, h("strong", { class: "g-title", text: guide.title }), h("span", { class: "g-text", text: guide.text }))) : null,
    h("div", { class: "actions" }, h("button", { class: "btn small solo-stretto", onclick: showExplorer, text: tr("Esplora il dizionario") })),
    dictState === "carico" && me ? h("p", { class: "note", style: "text-align:center", text: tr("Carico il dizionario ({n} parole)…", { n: dictLangs.reduce((n, l) => n + DIZ[l].parole, 0).toLocaleString(LANG) }) }) : null,
    h("details", { class: "card" }, h("summary", { text: tr("Cronaca della partita") }), h("div", { class: "log" }, s.log.slice().reverse().map(m => h("div", { text: G.testoLog(m, { A: seatName(s, "A"), B: seatName(s, "B") }) })))),
    me ? (ui.delConfirm
      ? h("div", { class: "actions" }, h("button", { class: "btn small", onclick: () => { ui.delConfirm = false; render(); }, text: tr("Annulla") }), h("button", { class: "btn small danger", onclick: deleteGame, text: tr("Elimina per sempre") }))
      : h("div", { class: "actions" }, h("button", { class: "btn link", onclick: () => { ui.delConfirm = true; render(); }, text: tr("Elimina partita") }))) : null,
    langSwitch()
  );
}

function render() {
  const inGame = !!cur;
  document.getElementById("lobby").hidden = inGame;
  document.getElementById("game").hidden = !inGame;
  if (inGame) renderGame(); else renderLobby();
  updateSide();
}
document.getElementById("toast").addEventListener("click", hideToast);
document.getElementById("sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
function isTypingTarget(el) {
  return !!(el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable));
}
function onBoardKeyDown(e) {
  if (e.key === "Escape" && !document.getElementById("sheet").hidden) { closeSheet(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!document.getElementById("sheet").hidden) return;
  if (isTypingTarget(document.activeElement) || isTypingTarget(e.target)) return;
  if (!cur || !S() || !myTurn() || ui.busy || drag) return;
  if (e.key === "Escape") {
    if (ui.launch) { e.preventDefault(); ui.launch = null; render(); return; }
    if (ui.alch) { e.preventDefault(); ui.alch = null; render(); return; }
    if (ui.trasf) { e.preventDefault(); ui.trasf = null; render(); return; }
    if (ui.pending.length || ui.place) { e.preventDefault(); ui.pending = []; ui.mode = null; ui.place = null; ui.sel = null; hideToast(); render(); return; }
    if (ui.sel !== null || kbCell !== null) { e.preventDefault(); ui.sel = null; kbCell = null; render(); }
    return;
  }
  if (ui.alch || ui.trasf || ui.launch) return;
  if (e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "ArrowLeft" || e.key === "ArrowRight") {
    e.preventDefault();
    const rowStep = topSeat() === "A" ? 1 : -1;
    const [dr, dc] = e.key === "ArrowUp" ? [-rowStep, 0] : e.key === "ArrowDown" ? [rowStep, 0] : e.key === "ArrowLeft" ? [0, -1] : [0, 1];
    const base = kbCell || hoverCell || (ui.pending.length ? G.key(ui.pending[ui.pending.length - 1].r, ui.pending[ui.pending.length - 1].c) : null);
    if (base) {
      const [r, c] = G.parse(base);
      kbCell = G.key(Math.max(0, Math.min(G.ROWS - 1, r + dr)), Math.max(0, Math.min(G.COLS - 1, c + dc)));
    } else {
      const me = mySeat(), r0 = me === "A" ? 1 : G.ROWS - 2;
      kbCell = G.key(r0, Math.floor(G.COLS / 2));
    }
    render(); return;
  }
  const targetCell = kbCell || hoverCell;
  if (e.key === "Backspace" || e.key === "Delete") {
    const pi = targetCell ? ui.pending.findIndex(p => G.key(p.r, p.c) === targetCell) : -1;
    if (pi >= 0) { e.preventDefault(); ui.place = null; ui.pending.splice(pi, 1); ui.sel = null; render(); return; }
    if (e.key === "Backspace" && ui.pending.length) { e.preventDefault(); ui.place = null; ui.pending.pop(); ui.sel = null; render(); }
    return;
  }
  if (!targetCell || !e.key || e.key.length !== 1) return;
  const l = e.key.toUpperCase().normalize("NFD").replace(/[^A-Z]/g, "");
  if (l.length !== 1) return;
  const s = S(), me = mySeat();
  if (s.tiles[targetCell]) return;
  const pi = ui.pending.findIndex(p => G.key(p.r, p.c) === targetCell);
  if (pi >= 0 && ui.pending[pi].l === l) { e.preventDefault(); return; }
  const used = new Set(ui.pending.map((p, idx) => idx === pi ? -1 : p.hi));
  const hand = s.hands[me], hi = hand.findIndex((ch, i) => ch === l && !used.has(i));
  if (hi < 0) { e.preventDefault(); toast(tr("Non hai una {l} libera nel Grimorio.", { l }), true); return; }
  e.preventDefault();
  const [r, c] = G.parse(targetCell);
  ui.place = null; ui.sel = null;
  if (pi >= 0) ui.pending[pi] = { r, c, l, hi };
  else ui.pending.push({ r, c, l, hi });
  render();
}
document.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const cell = e.target && e.target.closest ? e.target.closest(".board .cell") : null;
  const k = cell ? cell.dataset.k : null;
  hoverCell = k;
  if (kbCell && k && k !== kbCell) { kbCell = null; render(); }
}, { passive: true });
document.addEventListener("pointerleave", () => { hoverCell = null; });
window.addEventListener("blur", () => { hoverCell = null; });
window.addEventListener("keydown", onBoardKeyDown);
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && games[id] && (!cur || cur.id !== id)) openGame(id); });
init();
</script>
